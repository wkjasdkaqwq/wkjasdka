<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Settings - W.K.Jasdka</title>
  <link rel="icon" href="/wkjasdka/index/echo logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
::selection {
  background: #E67E22;
  color: #fff;
}
::-moz-selection {
  background: #E67E22;
  color: #fff;
}
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100vh; background: #fff; color: #333; -webkit-tap-highlight-color: transparent; transition: background-color .25s, color .25s; }

    .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 4.125rem; box-sizing: border-box; padding: 0; z-index: 9000; background: #d7d7d7; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
    .navbar-container { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 100%; }
    .navbar-logo { display: inline-block; margin-left: 0; color: #333; font-size: 1.5rem; font-weight: bold; text-decoration: none; position: relative; perspective: 1200px; transform-style: preserve-3d; transition: color .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1); text-shadow: 1px 1px 3px rgba(0,0,0,.2); }
    .navbar-logo:hover { color: #666; }
    .navbar-logo.flip-180 { transform: rotateY(180deg); }
    .navbar-logo::before { content: attr(data-text); position: absolute; top: 0; left: 0; color: inherit; transform: rotateY(180deg); backface-visibility: hidden; }

    main { width: min(720px, calc(100% - 32px)); margin: 112px auto 48px; }
    .page-heading { margin-bottom: 1.5rem; }
    .page-heading h1 { margin: 0 0 .45rem; font-size: clamp(1.8rem, 5vw, 2.4rem); }
    .page-heading p { margin: 0; color: #66717a; line-height: 1.5; }
    .settings-card { padding: .25rem 1.25rem; border: 1px solid #e3e7eb; border-radius: 14px; background: #f8f9fa; box-shadow: 0 5px 18px rgba(0,0,0,.06); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; min-height: 94px; padding: 1rem 0; }
    .setting-row + .setting-row { border-top: 1px solid #e0e4e8; }
    .setting-copy { min-width: 0; }
    .setting-copy h2 { margin: 0 0 .35rem; font-size: 1.05rem; }
    .setting-copy p { margin: 0; color: #66717a; font-size: .92rem; line-height: 1.45; }
    .theme-toggle { position: relative; flex: 0 0 52px; width: 52px; height: 30px; margin: 0; appearance: none; border: 0; border-radius: 999px; background: #aab3bb; cursor: pointer; transition: background .2s ease; }
    .theme-toggle::before { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px #0003; transition: transform .2s ease; }
    .theme-toggle:checked { background: #2196f3; }
    .theme-toggle:checked::before { transform: translateX(22px); }
    .theme-toggle:focus-visible, .language-select:focus-visible, .navbar-logo:focus-visible { outline: 3px solid #64b5f6; outline-offset: 3px; }
    .language-select { width: min(220px, 42vw); min-height: 42px; padding: .5rem .75rem; border: 1px solid #c8d0d7; border-radius: 8px; background: #fff; color: #263238; font: inherit; }

    .loading-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #fff; }
    .loading-logo { display: none; width: 65px; height: auto; z-index: 10000; }
    #loadingLogoDark { display: none; }
    .loading-text-container { position: fixed !important; bottom: env(safe-area-inset-bottom,26px) !important; left: 0 !important; z-index: 10001 !important; display: none !important; width: 100% !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; pointer-events: none !important; transform: translateY(-32px) !important; }
    .loading-text { color: #8e8e8e; font-size: 16px; font-weight: 400; }
    .loading-ready #loadingLogoLight { display: block; }
    .loading-ready .loading-text-container { display: flex !important; }
    html.dark-mode .loading-ready #loadingLogoLight { display: none; }
    html.dark-mode .loading-ready #loadingLogoDark { display: block; }

    html.dark-mode { color-scheme: dark; background: #07121C; color: #e0e0e0; }
    html.dark-mode body { background: #07121C; color: #e0e0e0; }
    html.dark-mode .navbar { background: #0f1f2e; box-shadow: 0 2px 5px rgba(0,0,0,.5); }
    html.dark-mode .navbar-logo { color: #e0e0e0; }
    html.dark-mode .navbar-logo:hover { color: #b0b0b0; }
    html.dark-mode .page-heading p, html.dark-mode .setting-copy p { color: #a0aab3; }
    html.dark-mode .settings-card { background: #0d1a26; border-color: #1a2a3a; box-shadow: 0 5px 18px rgba(0,0,0,.2); }
    html.dark-mode .setting-row + .setting-row { border-color: #1a2a3a; }
    html.dark-mode .language-select { background: #0f1f2e; color: #e0e0e0; border-color: #34495a; }
    html.dark-mode .loading-screen { background: #07121C; }
    html.dark-mode .loading-text { color: #b0b0b0; }

    @media (max-width: 600px) {
      .navbar { height: 3.75rem; }
      /* Match the homepage navbar logo sizing so both navbars have the same height on mobile. */
      .navbar-logo { margin-left: 0; font-size: 1.1rem; }
      main { margin-top: 94px; }
      .settings-card { padding: .15rem 1rem; }
      .setting-row { min-height: 88px; }
      .setting-copy h2 { font-size: 1rem; }
      .setting-copy p { font-size: .85rem; }
      .loading-logo { width: 35px; }
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Site header">
    <div class="navbar-container">
      <a class="navbar-logo" id="logo" href="wkjasdka.html" data-text="W.K.Jasdka">W.K.Jasdka</a>
    </div>
  </nav>

  <main>
    <header class="page-heading">
      <h1 data-i18n="title">Settings</h1>
      <p data-i18n="intro">Choose your preferred appearance and language.</p>
    </header>

    <section class="settings-card" aria-label="Settings">
      <div class="setting-row">
        <div class="setting-copy">
          <h2 data-i18n="darkTitle">Dark mode</h2>
          <p data-i18n="darkDescription">Use the dark color scheme on this device.</p>
        </div>
        <input class="theme-toggle" id="darkModeToggle" type="checkbox" role="switch" aria-label="Dark mode">
      </div>
      <div class="setting-row">
        <div class="setting-copy">
          <h2 data-i18n="languageTitle">Language</h2>
          <p data-i18n="languageDescription">Choose the language used on this settings page.</p>
        </div>
        <select class="language-select" id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="zh-CN">简体中文</option>
        </select>
      </div>
    </section>
  </main>

  <div class="loading-screen" id="loadingScreen" aria-label="Loading">
    <img src="/wkjasdka/index/logo3.png" alt="Loading logo" class="loading-logo" id="loadingLogoLight">
    <img src="/wkjasdka/index/dark_mode.png" alt="Loading logo" class="loading-logo" id="loadingLogoDark">
    <div class="loading-text-container" id="loadingTexts">
      <div class="loading-text">from</div>
      <div class="loading-text">- Wkjasdka -</div>
    </div>
  </div>

  <script>
    const translations = {
      en: {
        title: 'Settings',
        intro: 'Choose your preferred appearance and language.',
        darkTitle: 'Dark mode',
        darkDescription: 'Use the dark color scheme on this device.',
        languageTitle: 'Language',
        languageDescription: 'Choose the language used on this settings page.'
      },
      'zh-CN': {
        title: '设置',
        intro: '选择你偏好的外观和语言。',
        darkTitle: '深色模式',
        darkDescription: '在此设备上使用深色主题。',
        languageTitle: '语言',
        languageDescription: '选择设置页面的显示语言。'
      }
    };

    const root = document.documentElement;
    const darkModeToggle = document.getElementById('darkModeToggle');
    const languageSelect = document.getElementById('languageSelect');
    const savedTheme = localStorage.getItem('wkjasdka-dark-mode');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = savedTheme === null ? prefersDark : savedTheme === 'true';
    const savedLanguage = localStorage.getItem('wkjasdka-language');

    function setDarkMode(enabled, persist = true) {
      root.classList.toggle('dark-mode', enabled);
      root.classList.toggle('light-mode', !enabled);
      darkModeToggle.checked = enabled;
      if (persist) localStorage.setItem('wkjasdka-dark-mode', String(enabled));
    }

    function setLanguage(language, persist = true) {
      const selectedLanguage = translations[language] ? language : 'en';
      document.documentElement.lang = selectedLanguage === 'zh-CN' ? 'zh-CN' : 'en-GB';
      languageSelect.value = selectedLanguage;
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.dataset.i18n;
        element.textContent = translations[selectedLanguage][key];
      });
      if (persist) localStorage.setItem('wkjasdka-language', selectedLanguage);
    }

    setDarkMode(isDark, false);
    setLanguage(savedLanguage || 'en', false);
    darkModeToggle.addEventListener('change', () => setDarkMode(darkModeToggle.checked));
    languageSelect.addEventListener('change', () => setLanguage(languageSelect.value));

    document.getElementById('logo').addEventListener('click', event => {
      if (event.currentTarget.href === window.location.href) {
        event.preventDefault();
        event.currentTarget.classList.toggle('flip-180');
      }
    });

    window.addEventListener('load', () => {
      const loading = document.getElementById('loadingScreen');
      loading.classList.add('loading-ready');
      window.setTimeout(() => { loading.style.display = 'none'; }, 350);
    }, { once: true });
  </script>
</body>
</html>
