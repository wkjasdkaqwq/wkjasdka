<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Settings - W.K.Jasdka</title>
  <link rel="icon" href="/wkjasdka/index/echo logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100vh; background: #fff; color: #333; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

    .navbar { position: fixed; top: 0; left: 0; width: 100%; padding: 1.2rem 0; z-index: 9000; background: #d7d7d7; box-shadow: 0 2px 5px rgba(0,0,0,.1); transition: transform .4s ease-out; }
    .navbar.hidden { transform: translateY(-100%); }
    .navbar-container { display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 0 auto; }
    .navbar-logo { display: inline-block; margin-left: 80px; color: #333; font-size: 1.5rem; font-weight: bold; text-decoration: none; cursor: pointer; position: relative; perspective: 1200px; transform-style: preserve-3d; transition: color .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1); text-shadow: 1px 1px 3px rgba(0,0,0,.2); }
    .navbar-logo:hover { color: #666; }
    .navbar-logo.flip-180 { transform: rotateY(180deg); }
    .navbar-logo::before { content: attr(data-text); position: absolute; top: 0; left: 0; color: inherit; transform: rotateY(180deg); backface-visibility: hidden; }
    .navbar-menu { display: flex; margin: 0; padding: 0 1rem; list-style: none; }

    .menu-btn { position: absolute; top: 50%; right: 20px; width: 30px; height: 24px; z-index: 9001; cursor: pointer; transform: translateY(-50%); transition: transform .35s ease-out; }
    .menu-btn .line { position: absolute; width: 100%; height: 3px; border-radius: 2px; background: #333; transform-origin: right center; transition: all .35s ease-out; }
    .menu-btn .line1 { top: 0; transition-delay: .02s; }
    .menu-btn .line2 { top: 50%; transform: translateY(-50%); transition-delay: .04s; }
    .menu-btn .line3 { bottom: 0; transition-delay: .06s; }
    .menu-btn.rotated { transform: translateY(-50%) rotate(90deg) scale(1.1); transition: transform .25s cubic-bezier(.215,.61,.355,1); }
    .menu-btn.rotated .line { transform-origin: center; transition: all .25s cubic-bezier(.215,.61,.355,1); }
    .menu-btn:active { transform: translateY(-50%) scale(.9); }

    .sidebar { position: fixed; top: 0; right: 0; width: 500px; height: 100vh; padding-top: 80px; overflow-x: hidden; overflow-y: auto; z-index: 8999; background: #f5f5f5; box-shadow: -2px 0 10px rgba(0,0,0,.1); transform: translateX(100%); transition: transform .3s ease-out; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-menu { margin: 0; padding: 0 0 80px; list-style: none; }
    .sidebar-menu-main { margin: 0; padding: 0; }
    .sidebar-item { margin: 0; overflow: hidden; border-bottom: 1px solid #e0e0e0; }
    .sidebar-item:has(.fa-info-circle) { border-bottom: 0; }
    .sidebar-link { position: relative; display: block; padding: 15px 25px; color: #333; font-size: 1.1rem; text-decoration: none; transition: all .3s ease; }
    .sidebar-link:hover { padding-left: 30px; background: #e0e0e0; }
    .sidebar-link i { width: 20px; margin-right: 10px; text-align: center; }
    .sidebar-link:active { transform: scale(.96); background: #d0d0d0; }
    .has-submenu > .sidebar-link::after { content: '\f062'; position: absolute; right: 20px; font-family: 'Font Awesome 6 Free'; font-size: .9rem; font-weight: 900; transition: transform .3s ease; }
    .has-submenu.open > .sidebar-link::after { transform: rotate(90deg); }
    .social-platform-link::after { content: '\f078' !important; }
    .has-submenu.open .social-platform-link::after { transform: rotate(180deg) !important; }
    .sidebar-submenu { max-height: 0; overflow: hidden; padding: 0; background: #e9e9e9; transition: max-height .15s ease-out; }
    .sidebar-submenu.open { max-height: 1000px; }
    .sidebar-submenu .sidebar-link { padding-left: 50px; font-size: 1rem; transform: scale(0); transition: transform 0s ease, padding 0s ease; }
    .sidebar-submenu.open .sidebar-link { transform: scale(1); }
    .sidebar::-webkit-scrollbar { display: none; width: 0 !important; }

    .sidebar-settings { position: absolute; bottom: 20px; left: 20px; z-index: 9000; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: #e2e2e2; color: #333; font-size: 1.2rem; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.18); transition: background .2s ease, transform .2s ease; }
    .sidebar-settings:hover, .sidebar-settings:focus-visible { background: #d2d2d2; transform: scale(1.08); }
    .sidebar-settings:active { transform: scale(.94); }
    .sidebar-settings::after { content: attr(data-tooltip); position: absolute; top: 50%; left: 56px; padding: 6px 9px; border-radius: 4px; background: #333; color: #fff; font-size: .85rem; white-space: nowrap; opacity: 0; visibility: hidden; transform: translateY(-50%); pointer-events: none; transition: opacity .18s ease, visibility .18s ease; }
    .sidebar-settings:hover::after, .sidebar-settings:focus-visible::after { opacity: 1; visibility: visible; }

    .overlay { position: fixed; inset: 0; z-index: 8998; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .4s ease-out, visibility .4s ease-out; }
    .overlay.open { opacity: 1; visibility: visible; }
    .loading-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #fff; }
    .loading-logo { display: none; width: 65px; height: auto; z-index: 10000; }
    #loadingLogoDark { display: none; }
    .loading-text-container { position: fixed; bottom: env(safe-area-inset-bottom,26px); left: 0; z-index: 10001; display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; transform: translateY(-32px); }
    .loading-text { color: #8e8e8e; font-size: 16px; font-weight: 400; }
    .loading-ready #loadingLogoLight { display: block; }
    .loading-ready .loading-text-container { display: flex; }
    html.dark-mode .loading-ready #loadingLogoLight { display: none; }
    html.dark-mode .loading-ready #loadingLogoDark { display: block; }

    /* Settings content is intentionally empty; keep a clear area below the shared site header. */
    main { min-height: calc(100vh - 80px); margin-top: 80px; }

    html.dark-mode { color-scheme: dark; background: #07121C; color: #e0e0e0; }
    html.dark-mode body { background: #07121C; color: #e0e0e0; }
    html.dark-mode .navbar { background: #0f1f2e; box-shadow: 0 2px 5px rgba(0,0,0,.5); }
    html.dark-mode .navbar-logo, html.dark-mode .sidebar-link { color: #e0e0e0; }
    html.dark-mode .menu-btn .line { background: #e0e0e0; }
    html.dark-mode .sidebar { background: #0d1a26; box-shadow: -2px 0 10px rgba(0,0,0,.7); }
    html.dark-mode .sidebar-item { border-color: #1a2a3a; }
    html.dark-mode .sidebar-submenu { background: #0a1420; }
    html.dark-mode .sidebar-link:hover { background: #1a2a3a; }
    html.dark-mode .sidebar-settings { background: #1a2a3a; color: #e0e0e0; }
    html.dark-mode .sidebar-settings:hover { background: #26394d; }
    html.dark-mode .overlay { background: rgba(0,0,0,.7); }
    html.dark-mode .loading-screen { background: #07121C; }
    html.dark-mode .loading-text { color: #b0b0b0; }

    @media (prefers-color-scheme: dark) {
      html:not(.light-mode) { color-scheme: dark; background: #07121C; color: #e0e0e0; }
      html:not(.light-mode) body { background: #07121C; color: #e0e0e0; }
      html:not(.light-mode) .navbar { background: #0f1f2e; box-shadow: 0 2px 5px rgba(0,0,0,.5); }
      html:not(.light-mode) .navbar-logo, html:not(.light-mode) .sidebar-link { color: #e0e0e0; }
      html:not(.light-mode) .menu-btn .line { background: #e0e0e0; }
      html:not(.light-mode) .sidebar { background: #0d1a26; box-shadow: -2px 0 10px rgba(0,0,0,.7); }
      html:not(.light-mode) .sidebar-item { border-color: #1a2a3a; }
      html:not(.light-mode) .sidebar-submenu { background: #0a1420; }
      html:not(.light-mode) .sidebar-link:hover { background: #1a2a3a; }
      html:not(.light-mode) .sidebar-settings { background: #1a2a3a; color: #e0e0e0; }
      html:not(.light-mode) .overlay { background: rgba(0,0,0,.7); }
      html:not(.light-mode) .loading-screen { background: #07121C; }
      html:not(.light-mode) .loading-text { color: #b0b0b0; }
    }

    @media (max-width: 600px) {
      .sidebar { width: 85vw; padding-top: 65px; font-size: 1rem; }
      .navbar-logo { margin-left: 44px; font-size: 1.1rem; }
      .sidebar-link { padding: 10px 18px; font-size: .98rem; }
      .sidebar-submenu .sidebar-link { padding-left: 35px; font-size: .98rem; }
      .loading-logo { width: 35px; }
    }
  </style>
</head>
<body>

    <div class="menu-btn" id="menuBtn" role="button" tabindex="0" aria-label="Open menu" aria-expanded="false">
      <div class="line line1"></div><div class="line line2"></div><div class="line line3"></div>
    </div>
    <div class="navbar-container">
      <a class="navbar-logo" id="logo" href="wkjasdka.html" data-text="W.K.Jasdka">W.K.Jasdka</a>
      <ul class="navbar-menu"></ul>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar" aria-label="Site navigation">
    <ul class="sidebar-menu">
      <div class="sidebar-menu-main">

        <li class="sidebar-item has-submenu">

  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="loading-screen" id="loadingScreen" aria-label="Loading">
    <img src="/wkjasdka/index/logo3.png" alt="Loading logo" class="loading-logo" id="loadingLogoLight">
    <img src="/wkjasdka/index/dark_mode.png" alt="Loading logo" class="loading-logo" id="loadingLogoDark">
    <div class="loading-text-container" id="loadingTexts"><div class="loading-text">from</div><div class="loading-text">- Wkjasdka -</div></div>
  </div>

  <main id="mainContent" aria-label="Settings page"></main>

  <script>
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) document.documentElement.classList.add('dark-mode');

    const menuButton = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      menuButton.classList.remove('rotated');
      menuButton.setAttribute('aria-expanded', 'false');
      menuButton.setAttribute('aria-label', 'Open menu');
      document.body.style.overflow = '';
      document.querySelectorAll('.sidebar-submenu.open, .sidebar-item.has-submenu.open').forEach(element => element.classList.remove('open'));
    }

    function toggleSidebar() {
      const isOpen = sidebar.classList.toggle('open');
      overlay.classList.toggle('open', isOpen);
      menuButton.classList.toggle('rotated', isOpen);
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }

    menuButton.addEventListener('click', toggleSidebar);
    menuButton.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleSidebar(); }
    });
    overlay.addEventListener('click', closeSidebar);

    document.querySelectorAll('.sidebar-item.has-submenu').forEach(item => {
      const link = item.querySelector(':scope > .sidebar-link');
      const submenu = item.querySelector('.sidebar-submenu');
      link.addEventListener('click', event => {
        event.preventDefault();
        submenu.classList.toggle('open');
        item.classList.toggle('open');
      });
    });

    document.getElementById('logo').addEventListener('click', event => {
      if (event.currentTarget.href === window.location.href) {
        event.preventDefault();
        event.currentTarget.classList.toggle('flip-180');
      }
    });

    window.addEventListener('load', () => {
      const loading = document.getElementById('loadingScreen');
      loading.classList.add('loading-ready');
      window.setTimeout(() => {
        loading.style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      }, 350);
    }, { once: true });
  </script>
