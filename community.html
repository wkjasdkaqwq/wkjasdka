<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      const themeKey = 'wkjasdka-dark-mode';
      const root = document.documentElement;
      const systemTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      const savedTheme = () => {
        try {
          const value = localStorage.getItem(themeKey);
          if (value === 'dark' || value === 'true') return 'dark';
          if (value === 'light' || value === 'false') return 'light';
          return 'system';
        } catch (_) {
          return 'system';
        }
      };
      const applyTheme = () => {
        const preference = savedTheme();
        const dark = preference === 'dark' || (preference === 'system' && Boolean(systemTheme && systemTheme.matches));
        root.classList.toggle('dark-mode', dark);
        root.classList.toggle('light-mode', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      applyTheme();
      window.addEventListener('storage', event => {
        if (event.key === themeKey || event.key === null) applyTheme();
      });
      if (systemTheme) {
        const onSystemThemeChange = () => {
          if (savedTheme() === 'system') applyTheme();
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', onSystemThemeChange);
        else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>
    <title data-i18n="documentTitle">Liuyanlin Community — Semi-rounded Corners</title>
    <style>
::selection {
  background: #E67E22;
  color: #fff;
}
::-moz-selection {
  background: #E67E22;
  color: #fff;
}
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #fff;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #mainContent {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: 100vh;
            padding: 40px;
        }

        .content-box {
            width: min(800px, 100%);
            text-align: center;
        }

        .community-logo {
            display: block;
            width: min(300px, 62vw);
            height: auto;
            margin: 0 auto 28px;
        }

        .page-title {
            margin: 0;
            font-size: 3rem;
            color: #333;
        }

        .page-description {
            margin: 18px 0 0;
            font-size: 1.2rem;
            color: #666;
        }

        .placeholder-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-top: 40px;
        }

        .placeholder-item {
            height: 150px;
            border-radius: 12px;
            background: #f5f5f5;
        }

        @media (max-width: 640px) {
            #mainContent {
                padding: 28px 20px;
            }

            .page-title {
                font-size: 2.25rem;
            }

            .placeholder-grid {
                grid-template-columns: 1fr;
            }
        }
        html.dark-mode,
        html.dark-mode body {
            background: #07121C;
            color: #e0e0e0;
        }

        html.dark-mode .page-title {
            color: #e0e0e0;
        }

        html.dark-mode .page-description {
            color: #a0a0a0;
        }

        html.dark-mode .placeholder-item {
            background: #0f1f2e;
        }
    </style>
</head>
<body>
    <main id="mainContent">
        <div class="content-box">
            <img
                class="community-logo"
                src="/wkjasdka/index/community2.png"
                alt="Liuyanlin Community"
                data-i18n-alt="logoAlt"
            >

            <h1 class="page-title" data-i18n="pageHeading">Test</h1>
            <p class="page-description" data-i18n="pageDescription">This is a Community front-end test page.</p>

            <div class="placeholder-grid">
                <div class="placeholder-item"></div>
                <div class="placeholder-item"></div>
                <div class="placeholder-item"></div>
            </div>
        </div>
    </main>
    <script src="./scripts/i18n.js?v=20261117-language-directory"></script>
    <script>
        SiteI18n.init({ namespace: 'community', defaultLocale: 'en' })
            .catch(error => console.error('[community] Could not initialize translations.', error));
    </script>
</body>
</html>
