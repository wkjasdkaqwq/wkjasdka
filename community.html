<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-rounded Corner on Liuyanlin Community</title>
    <style>
        :root {
            --accent: #ff8000;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body.is-ready {
            overflow: auto;
        }

        .top-loading-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            z-index: 10001;
            background: var(--accent);
            transition: width .3s cubic-bezier(.1, .5, .5, 1), opacity .5s ease;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: #fff;
            opacity: 1;
            transition: opacity 1.2s ease;
        }

        /* 加载完成后，整个加载层变透明，内容页从后方穿透显示 */
        .loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #logoContainer {
            z-index: 1;
            text-align: center;
            opacity: 0;
            transform: scale(.92);
            transition: opacity .55s ease, transform .55s ease;
        }

        #logoContainer.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* 内容页加载完成后，仅让 Logo 慢慢变透明 */
        #logoContainer.fade-out {
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .loading-logo {
            display: block;
            width: min(300px, 62vw);
            height: auto;
        }

        .bottom-info {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            opacity: 1;
            transition: opacity .35s ease;
        }

        .loading-text {
            margin: 5px 0;
            color: #6a6a6a;
            font-size: 16px;
        }

        #mainContent {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: 40px;
            background: #fff;
        }

        .content-box {
            max-width: 800px;
            text-align: center;
        }

        .placeholder-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-top: 40px;
        }

        .placeholder-item {
            height: 150px;
            border-radius: 12px;
            background: #f5f5f5;
        }

    </style>
</head>
<body>
    <div class="top-loading-bar" id="topLoadingBar"></div>

    <div class="loading-screen" id="loadingScreen" aria-label="页面加载中">
        <div id="logoContainer">
            <img class="loading-logo" src="/wkjasdka/index/community2.png" alt="Logo">
        </div>

        <div class="bottom-info" id="bottomInfo">
            <div class="loading-text">from</div>
            <div class="loading-text">- Wkjasdka -</div>
        </div>
    </div>

    <main id="mainContent">
        <div class="content-box">
            <h1 style="font-size: 3rem; color: #333;">测试</h1>
            <p style="font-size: 1.2rem; color: #666;">
                <br>
                这是一个 Community 前端页面测试
            </p>
            <div class="placeholder-grid">
                <div class="placeholder-item"></div>
                <div class="placeholder-item"></div>
                <div class="placeholder-item"></div>
            </div>
        </div>
    </main>

    <script>
        const loadingBar = document.getElementById('topLoadingBar');
        const logoContainer = document.getElementById('logoContainer');
        const loadingScreen = document.getElementById('loadingScreen');

        let currentProgress = 0;
        let isFullyLoaded = false;
        let hasStartedReveal = false;

        function updateProgress(percent) {
            currentProgress = Math.min(percent, 100);
            loadingBar.style.width = currentProgress + '%';
        }

        function showLogo() {
            logoContainer.classList.add('visible');

            const waitingTimer = setInterval(() => {
                if (isFullyLoaded) {
                    clearInterval(waitingTimer);
                    finishLoadingSequence();
                } else if (currentProgress < 90) {
                    updateProgress(currentProgress + 0.5);
                }
            }, 100);
        }

        function initLoading() {
            const startTimer = setInterval(() => {
                if (currentProgress < 50) {
                    const step = (50 - currentProgress) / 10;
                    updateProgress(currentProgress + Math.max(step, 1));
                } else {
                    clearInterval(startTimer);
                    showLogo();
                }
            }, 50);
        }

        function finishLoadingSequence() {
            if (hasStartedReveal) return;
            hasStartedReveal = true;
            updateProgress(100);

            setTimeout(() => {
                loadingBar.style.opacity = '0';
                loadingScreen.classList.add('fade-out');
            }, 350);
        }

        window.addEventListener('load', () => {
            isFullyLoaded = true;
        });

        // 防止外部图片路径失效时页面永远停留在加载状态
        setTimeout(() => {
            isFullyLoaded = true;
        }, 5000);

        initLoading();
    </script>
</body>
</html>
