<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      const themeKey = 'wkjasdka-dark-mode';
      const root = document.documentElement;
      const systemTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      const savedTheme = () => {
        try {
          const value = localStorage.getItem(themeKey);
          if (value === 'dark' || value === 'true') return 'dark';
          if (value === 'light' || value === 'false') return 'light';
          return 'system';
        } catch (_) {
          return 'system';
        }
      };
      const applyTheme = () => {
        const preference = savedTheme();
        const dark = preference === 'dark' || (preference === 'system' && Boolean(systemTheme && systemTheme.matches));
        root.classList.toggle('dark-mode', dark);
        root.classList.toggle('light-mode', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      applyTheme();
      window.addEventListener('storage', event => {
        if (event.key === themeKey || event.key === null) applyTheme();
      });
      if (systemTheme) {
        const onSystemThemeChange = () => {
          if (savedTheme() === 'system') applyTheme();
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', onSystemThemeChange);
        else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>
    <title data-i18n="documentTitle">Liuyanlin Community — Semi-rounded Corners</title>
    <style>
::selection {
  background: #E67E22;
  color: #fff;
}
::-moz-selection {
  background: #E67E22;
  color: #fff;
}
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #fff;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #mainContent {
            display: none;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: 100vh;
            padding: 40px;
        }

        .loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #fff; display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 1; visibility: visible; }
        .loading-screen, .loading-screen * { -webkit-user-select: none !important; -moz-user-select: none !important; user-select: none !important; }
        .loading-logo { width: 65px; height: auto; z-index: 10000; display: none; }
        #loadingLogoDark { display: none; }
        .loading-text-container { position: fixed !important; bottom: env(safe-area-inset-bottom, 26px) !important; left: 0 !important; width: 100% !important; display: none !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; z-index: 10001 !important; visibility: visible !important; pointer-events: none !important; -webkit-text-size-adjust: 100% !important; transform: translateY(-32px) !important; }
        .loading-ready #loadingLogoLight { display: block !important; }
        html.dark-mode .loading-ready #loadingLogoLight { display: none !important; }
        html.dark-mode .loading-ready #loadingLogoDark { display: block !important; }
        .loading-ready .loading-text-container { display: flex !important; }
        .loading-footer-image { display: block; width: 5.85rem; max-width: 54vw; max-height: 2.6625rem; height: auto; object-fit: contain; }
        html.dark-mode .loading-footer-image { filter: invert(1); }
        html.dark-mode .loading-screen { background-color: #07121C !important; }

        .content-box {
            width: min(800px, 100%);
            text-align: center;
        }

        .community-logo {
            display: block;
            width: min(300px, 62vw);
            height: auto;
            margin: 0 auto 28px;
        }

        .page-title {
            margin: 0;
            font-size: 3rem;
            color: #333;
        }

        .page-description {
            margin: 18px 0 0;
            font-size: 1.2rem;
            color: #666;
        }

        .placeholder-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-top: 40px;
        }

        .placeholder-item {
            height: 150px;
            border-radius: 12px;
            background: #f5f5f5;
        }

        @media (max-width: 640px) {
            #mainContent {
                padding: 28px 20px;
            }

            .page-title {
                font-size: 2.25rem;
            }

            .placeholder-grid {
                grid-template-columns: 1fr;
            }
        }
        html.dark-mode,
        html.dark-mode body {
            background: #07121C;
            color: #e0e0e0;
        }

        html.dark-mode .page-title {
            color: #e0e0e0;
        }

        html.dark-mode .page-description {
            color: #a0a0a0;
        }

        html.dark-mode .placeholder-item {
            background: #0f1f2e;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen"><img data-src="/wkjasdka/index/logo3.png" alt="Loading logo" data-i18n-alt="home.loadingLogoAlt" class="loading-logo" id="loadingLogoLight"><img data-src="/wkjasdka/index/dark_mode.png" alt="Loading logo" data-i18n-alt="home.loadingLogoAlt" class="loading-logo" id="loadingLogoDark"><div class="loading-text-container" id="loadingTexts" aria-hidden="false"><img class="loading-footer-image" data-src="index/under%20logo.png" alt="from - Wkjasdka -"></div></div>
    <main id="mainContent">
        <div class="content-box">
            <img
                class="community-logo"
                data-src="/wkjasdka/index/community2.png"
                alt="Liuyanlin Community"
                data-i18n-alt="logoAlt"
            >

            <h1 class="page-title" data-i18n="pageHeading">Test</h1>
            <p class="page-description" data-i18n="pageDescription">This is a Community front-end test page.</p>

            <div class="placeholder-grid">
                <div class="placeholder-item"></div>
                <div class="placeholder-item"></div>
                <div class="placeholder-item"></div>
            </div>
        </div>
    </main>
    <script src="./scripts/i18n.js?v=20261117-language-directory"></script>
    <script>
        if (window.SiteI18n) {
            SiteI18n.init({ namespace: 'community', defaultLocale: 'en' })
                .catch(error => console.error('[community] Could not initialize translations.', error));
        }

        (function () {
            const loading = document.getElementById('loadingScreen');
            const main = document.getElementById('mainContent');
            const root = document.documentElement;
            const light = document.getElementById('loadingLogoLight');
            const dark = document.getElementById('loadingLogoDark');
            const footer = document.querySelector('.loading-footer-image');

            function setImageSource(image) {
                if (!image) return;
                const source = image.getAttribute('data-src');
                if (source) {
                    image.src = source;
                    image.removeAttribute('data-src');
                }
            }

            function waitForImage(image) {
                return new Promise(resolve => {
                    if (!image) {
                        resolve(false);
                        return;
                    }
                    const finish = async () => {
                        if (image.naturalWidth <= 0) {
                            resolve(false);
                            return;
                        }
                        try {
                            if (typeof image.decode === 'function') await image.decode();
                            requestAnimationFrame(() => resolve(image.naturalWidth > 0));
                        } catch (_) {
                            resolve(false);
                        }
                    };
                    if (image.complete) {
                        finish();
                        return;
                    }
                    image.addEventListener('load', finish, { once: true });
                    image.addEventListener('error', () => resolve(false), { once: true });
                });
            }

            function loadContentImages() {
                document.querySelectorAll('img[data-src]:not(.loading-logo)').forEach(setImageSource);
            }

            const pageLoad = new Promise(resolve => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { once: true });
            });

            document.addEventListener('DOMContentLoaded', async () => {
                setImageSource(light);
                setImageSource(dark);
                setImageSource(footer);

                const [lightReady, darkReady, footerReady] = await Promise.all([
                    waitForImage(light),
                    waitForImage(dark),
                    waitForImage(footer)
                ]);

                const centerReady = root.classList.contains('dark-mode') ? darkReady : lightReady;
                if (centerReady && footerReady && loading) loading.classList.add('loading-ready');

                loadContentImages();
                await pageLoad;
                await Promise.all(Array.from(document.images, waitForImage));
                if (loading) loading.style.display = 'none';
                if (main) main.style.display = 'flex';
            }, { once: true });
        })();
    </script>
</body>
</html>
