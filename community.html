  <script>
    (function () {
      const themeKey = 'wkjasdka-dark-mode';
      const root = document.documentElement;
      const systemTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      const savedTheme = () => {
        try {
          const value = localStorage.getItem(themeKey);
          if (value === 'dark' || value === 'true') return 'dark';
          if (value === 'light' || value === 'false') return 'light';
          return 'system';
        } catch (_) {
          return 'system';
        }
      };
      const applyTheme = () => {
        const preference = savedTheme();
        const dark = preference === 'dark' || (preference === 'system' && Boolean(systemTheme && systemTheme.matches));
        root.classList.toggle('dark-mode', dark);
        root.classList.toggle('light-mode', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      applyTheme();
      window.addEventListener('storage', event => {
        if (event.key === themeKey || event.key === null) applyTheme();
      });
      if (systemTheme) {
        const onSystemThemeChange = () => {
          if (savedTheme() === 'system') applyTheme();
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', onSystemThemeChange);
        else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>

    <script>
        (function () {
            'use strict';
            const loading = document.getElementById('loadingScreen');
            const main = document.getElementById('mainContent');
            const progress = document.getElementById('loadingProgress');
            const fill = document.getElementById('loadingProgressFill');
            const error = document.getElementById('loadingError');
            const retry = document.getElementById('loadingRetry');
            const loadingLogo = document.getElementById('loadingLogo');
            const contentLogo = main.querySelector('.community-logo');
            const logoImages = [
                loadingLogo,
                document.querySelector('.loading-footer-image')
            ];
            const contentImages = Array.from(main.querySelectorAll('img[data-src]')).filter(image => image !== contentLogo);
            const contentImageProgressShare = contentImages.length ? 0.5 : 0;
            const scriptProgressShare = contentImages.length ? 0.25 : 0.5;
            const dictionaryProgressShare = 1 - contentImageProgressShare - scriptProgressShare;
            const objectUrls = new Set();
            const timeoutMs = 45000;
            const dictionaryProgress = new Map();
            const supportedLocales = ['en', 'zh-CN', 'ru', 'de', 'fr', 'zh-HK', 'zh-TW', 'zh-MO'];
            function dictionaryTaskCount() {
                try {
                    const stored = localStorage.getItem('wkjasdka-language');
                    return supportedLocales.includes(stored) && stored !== 'en' ? 2 : 1;
                } catch (_) {
                    return 1;
                }
            }
            const expectedDictionaryCount = dictionaryTaskCount();
            let value = 0;

            // Older browsers may not implement inert; do not let keyboard or
            // pointer events reach the page before the interaction unlock.
            if (!('inert' in HTMLElement.prototype)) {
                ['click', 'keydown', 'pointerdown', 'touchstart'].forEach(type => {
                    main.addEventListener(type, event => {
                        if (!main.hasAttribute('inert')) return;
                        if (event.cancelable) event.preventDefault();
                        event.stopImmediatePropagation();
                    }, true);
                });
                main.addEventListener('focusin', event => {
                    if (main.hasAttribute('inert') && typeof event.target.blur === 'function') event.target.blur();
                }, true);
            }

            // Percentages represent the two stages, with equal weight per item.
            // For responses without a usable length, an item advances on completion.
            function setProgress(next) {
                value = Math.max(value, Math.min(100, next));
                fill.style.width = `${value}%`;
                progress.setAttribute('aria-valuenow', String(Math.floor(value)));
            }

            function loadImageSource(image, source) {
                return new Promise((resolve, reject) => {
                    let settled = false;
                    const timer = window.setTimeout(() => finish(new Error('Image load timed out')), timeoutMs);
                    function finish(failure) {
                        if (settled) return;
                        settled = true;
                        window.clearTimeout(timer);
                        image.removeEventListener('load', onLoad);
                        image.removeEventListener('error', onError);
                        if (failure) reject(failure);
                        else resolve();
                    }
                    async function onLoad() {
                        try {
                            if (!image.naturalWidth) throw new Error('Image is empty');
                            if (typeof image.decode === 'function') await image.decode();
                            finish();
                        } catch (failure) {
                            finish(failure);
                        }
                    }
                    function onError() { finish(new Error(`Could not load image: ${source}`)); }
                    image.addEventListener('load', onLoad, { once: true });
                    image.addEventListener('error', onError, { once: true });
                    image.src = source;
                    if (image.complete && image.naturalWidth) onLoad();
                });
            }

            async function createInverseAlphaMask(image) {
                if (!image.naturalWidth || !image.naturalHeight) throw new Error('Logo image is not decoded');
                const canvas = document.createElement('canvas');
                canvas.width = image.naturalWidth;
                canvas.height = image.naturalHeight;
                const context = canvas.getContext('2d', { willReadFrequently: true });
                if (!context || typeof canvas.toBlob !== 'function') throw new Error('Canvas mask generation is unavailable');
                context.drawImage(image, 0, 0);
                const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
                for (let index = 3; index < pixels.data.length; index += 4) {
                    pixels.data[index] = 255 - pixels.data[index];
                }
                context.putImageData(pixels, 0, 0);
                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob(result => result ? resolve(result) : reject(new Error('Could not encode the logo mask')), 'image/png');
                });
                const maskUrl = URL.createObjectURL(blob);
                objectUrls.add(maskUrl);
                try {
                    const maskImage = new Image();
                    await loadImageSource(maskImage, maskUrl);
                } catch (failure) {
                    objectUrls.delete(maskUrl);
                    URL.revokeObjectURL(maskUrl);
                    throw failure;
                }
                return maskUrl;
            }

            async function loadImage(image, report) {
                const source = image.getAttribute('data-src');
                if (!source) throw new Error('Missing image source');
                let blobUrl = null;
                let controller = null;
                let timer = null;
                try {
                    if (typeof window.fetch !== 'function' || !window.URL || !URL.createObjectURL) {
                        throw new Error('Streaming is unavailable');
                    }
                    controller = typeof AbortController === 'function' ? new AbortController() : null;
                    if (controller) timer = window.setTimeout(() => controller.abort(), timeoutMs);
                    const options = { credentials: 'same-origin' };
                    if (controller) options.signal = controller.signal;
                    const response = await fetch(source, options);
                    if (!response.ok) throw new Error(`Image request failed: ${response.status}`);

                    const encoding = response.headers.get('content-encoding');
                    const length = Number(response.headers.get('content-length'));
                    const measurable = length > 0 && (!encoding || encoding.toLowerCase() === 'identity');
                    let blob;
                    if (response.body && response.body.getReader) {
                        const reader = response.body.getReader();
                        const chunks = [];
                        let received = 0;
                        while (true) {
                            const part = await reader.read();
                            if (part.done) break;
                            chunks.push(part.value);
                            received += part.value.byteLength;
                            if (measurable && received <= length) report(Math.min(.99, received / length));
                        }
                        blob = new Blob(chunks, { type: response.headers.get('content-type') || 'application/octet-stream' });
                    } else {
                        blob = await response.blob();
                    }
                    blobUrl = URL.createObjectURL(blob);
                    await loadImageSource(image, blobUrl);
                    objectUrls.add(blobUrl);
                } catch (failure) {
                    if (blobUrl) URL.revokeObjectURL(blobUrl);
                    // Native image loading is also a fallback for browsers or CSPs
                    // that do not permit streaming or blob-backed image sources.
                    console.warn('[community] Loading image without byte progress.', failure);
                    await loadImageSource(image, source);
                } finally {
                    if (timer !== null) window.clearTimeout(timer);
                }
                image.removeAttribute('data-src');
                report(1);
            }

            function loadI18nScript() {
                const source = new URL('./scripts/i18n.js?v=20261117-community-progress', document.baseURI).href;
                function injectScript(scriptSource, blobUrl) {
                    return new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.dataset.i18nSource = source;
                        let settled = false;
                        const timer = window.setTimeout(() => finish(new Error('Language script load timed out')), timeoutMs);
                        function finish(failure) {
                            if (settled) return;
                            settled = true;
                            window.clearTimeout(timer);
                            script.onload = null;
                            script.onerror = null;
                            script.remove();
                            if (blobUrl) URL.revokeObjectURL(blobUrl);
                            if (failure) reject(failure);
                            else resolve();
                        }
                        script.onload = () => finish();
                        script.onerror = () => finish(new Error('Language script failed to load'));
                        script.src = scriptSource;
                        document.head.appendChild(script);
                    });
                }
                return (async () => {
                    let blobUrl = null;
                    let controller = null;
                    let timer = null;
                    try {
                        if (typeof window.fetch !== 'function' || !URL.createObjectURL) throw new Error('Streaming is unavailable');
                        controller = typeof AbortController === 'function' ? new AbortController() : null;
                        if (controller) timer = window.setTimeout(() => controller.abort(), timeoutMs);
                        const options = { credentials: 'same-origin' };
                        if (controller) options.signal = controller.signal;
                        const response = await fetch(source, options);
                        if (!response.ok) throw new Error(`Language script request failed: ${response.status}`);
                        const encoding = response.headers.get('content-encoding');
                        const length = Number(response.headers.get('content-length'));
                        const measurable = length > 0 && (!encoding || encoding.toLowerCase() === 'identity');
                        let blob;
                        if (response.body && response.body.getReader) {
                            const reader = response.body.getReader();
                            const chunks = [];
                            let received = 0;
                            while (true) {
                                const part = await reader.read();
                                if (part.done) break;
                                chunks.push(part.value);
                                received += part.value.byteLength;
                                if (measurable) setProgress(20 + 80 * (contentImageProgressShare + scriptProgressShare * Math.min(0.99, received / length)));
                            }
                            blob = new Blob(chunks, { type: response.headers.get('content-type') || 'text/javascript' });
                        } else {
                            blob = await response.blob();
                        }
                        blobUrl = URL.createObjectURL(blob);
                        await injectScript(blobUrl, blobUrl);
                    } catch (failure) {
                        if (blobUrl) URL.revokeObjectURL(blobUrl);
                        console.warn('[community] Falling back to native language script loading.', failure);
                        await injectScript(source, null);
                    } finally {
                        if (timer !== null) window.clearTimeout(timer);
                    }
                    setProgress(20 + 80 * (contentImageProgressShare + scriptProgressShare));
                })();
            }

            async function initializeLanguage() {
                window.__communityProgressObserver = (locale, fraction) => {
                    dictionaryProgress.set(locale, Math.max(dictionaryProgress.get(locale) || 0, fraction));
                    const aggregate = Array.from(dictionaryProgress.values()).reduce((sum, part) => sum + part, 0) / expectedDictionaryCount;
                    setProgress(20 + 80 * (contentImageProgressShare + scriptProgressShare + dictionaryProgressShare * Math.min(1, aggregate)));
                };
                await loadI18nScript();
                if (!window.SiteI18n) throw new Error('Language script did not initialize');
                // A first-visit language detection may supersede the initial
                // request; wait until a language was actually applied.
                let applied;
                let timer;
                const ready = new Promise((resolve, reject) => {
                    applied = () => resolve();
                    window.addEventListener('site:languagechange', applied, { once: true });
                    timer = window.setTimeout(() => reject(new Error('Language application timed out')), timeoutMs * 3);
                });
                try {
                    await Promise.all([SiteI18n.init({ namespace: 'community', defaultLocale: 'en' }), ready]);
                } finally {
                    window.clearTimeout(timer);
                    window.removeEventListener('site:languagechange', applied);
                }
            }

            function waitForFade() {
                return new Promise(resolve => {
                    let done = false;
                    const timer = window.setTimeout(finish, 500);
                    function finish(event) {
                        if (event && (event.target !== progress || event.propertyName !== 'opacity')) return;
                        if (done) return;
                        done = true;
                        window.clearTimeout(timer);
                        progress.removeEventListener('transitionend', finish);
                        progress.removeEventListener('transitioncancel', finish);
                        resolve();
                    }
                    progress.addEventListener('transitionend', finish);
                    progress.addEventListener('transitioncancel', finish);
                    progress.classList.add('is-fading');
                });
            }

            function revealCenter(reduceMotion) {
                return new Promise(resolve => {
                    const targets = [loadingLogo].filter(Boolean);
                    if (reduceMotion || targets.length === 0) {
                        loading.classList.add('is-center-revealing');
                        resolve();
                        return;
                    }
                    const pending = new Set(targets);
                    let done = false;
                    const timer = window.setTimeout(finish, 900);
                    function finish() {
                        if (done) return;
                        done = true;
                        window.clearTimeout(timer);
                        targets.forEach(target => {
                            target.removeEventListener('transitionend', onTransition);
                            target.removeEventListener('transitioncancel', onTransition);
                        });
                        resolve();
                    }
                    function onTransition(event) {
                        if (event.propertyName !== 'opacity' || !pending.has(event.currentTarget)) return;
                        pending.delete(event.currentTarget);
                        if (pending.size === 0) finish();
                    }
                    targets.forEach(target => {
                        target.addEventListener('transitionend', onTransition);
                        target.addEventListener('transitioncancel', onTransition);
                    });
                    loading.classList.add('is-center-revealing');
                });
            }

            const zoomDurationMs = 1150;
            const interactionUnlockProgress = 0.8;
            const clearOpeningWidthFraction = 599 / 743;
            const clearOpeningHeightFraction = 85 / 215;

            function unlockPageInteraction() {
                main.removeAttribute('inert');
                main.removeAttribute('aria-busy');
                document.documentElement.classList.remove('community-interaction-locked');
                loading.classList.add('allows-page-interaction');
            }

            function waitForZoomAnimation() {
                return new Promise(resolve => {
                    let done = false;
                    let timer;
                    const started = performance.now();
                    function finish() {
                        if (done) return;
                        done = true;
                        window.clearTimeout(timer);
                        loading.removeEventListener('animationstart', onStart);
                        loading.removeEventListener('animationend', onEnd);
                        loading.removeEventListener('animationcancel', onEnd);
                        unlockPageInteraction();
                        resolve();
                    }
                    function onStart(event) {
                        if (event.target === loading && event.animationName === 'community-unlock-marker') {
                            unlockPageInteraction();
                        }
                    }
                    function onEnd(event) {
                        if (event.target === loading && event.animationName === 'community-loader-zoom') finish();
                    }
                    function checkAnimation() {
                        const animations = typeof loading.getAnimations === 'function' ? loading.getAnimations() : [];
                        const zoom = animations.find(animation => animation.animationName === 'community-loader-zoom');
                        const timing = zoom && zoom.effect && zoom.effect.getComputedTiming();
                        if (timing && timing.progress !== null && timing.progress >= interactionUnlockProgress) unlockPageInteraction();
                        if (zoom && zoom.playState !== 'finished' && zoom.playState !== 'idle' &&
                            (document.hidden || performance.now() - started < 5000)) {
                            timer = window.setTimeout(checkAnimation, 250);
                        } else {
                            finish();
                        }
                    }
                    loading.addEventListener('animationstart', onStart);
                    loading.addEventListener('animationend', onEnd);
                    loading.addEventListener('animationcancel', onEnd);
                    timer = window.setTimeout(checkAnimation, zoomDurationMs + 400);
                    loading.classList.add('is-zooming-into-content');
                });
            }

            function waitForZoomCorrection(scale) {
                return new Promise(resolve => {
                    let done = false;
                    const timer = window.setTimeout(finish, 600);
                    function finish(event) {
                        if (event && (event.target !== loading || event.propertyName !== 'transform')) return;
                        if (done) return;
                        done = true;
                        window.clearTimeout(timer);
                        loading.removeEventListener('transitionend', finish);
                        loading.removeEventListener('transitioncancel', finish);
                        resolve();
                    }
                    loading.addEventListener('transitionend', finish);
                    loading.addEventListener('transitioncancel', finish);
                    loading.style.setProperty('--community-loader-clear-scale', String(scale));
                });
            }

            function getClearOpeningScale() {
                const logoStyle = window.getComputedStyle(loadingLogo);
                const logoWidth = parseFloat(logoStyle.width);
                const logoHeight = parseFloat(logoStyle.height);
                if (!(logoWidth > 0 && logoHeight > 0)) return null;
                return Math.max(
                    window.innerWidth / (logoWidth * clearOpeningWidthFraction),
                    window.innerHeight / (logoHeight * clearOpeningHeightFraction)
                ) * 1.05;
            }

            function clearOpeningCoversViewport() {
                const bounds = loadingLogo.getBoundingClientRect();
                const horizontalInset = (1 - clearOpeningWidthFraction) / 2;
                const verticalInset = (1 - clearOpeningHeightFraction) / 2;
                return bounds.left + bounds.width * horizontalInset <= 0 &&
                    bounds.right - bounds.width * horizontalInset >= window.innerWidth &&
                    bounds.top + bounds.height * verticalInset <= 0 &&
                    bounds.bottom - bounds.height * verticalInset >= window.innerHeight;
            }

            async function zoomLoadingIntoContent(reduceMotion) {
                if (reduceMotion) { unlockPageInteraction(); return; }
                // This centered area of community2.png is fully opaque; in the
                // inverse mask it forms a continuous clear opening.
                let clearScale = getClearOpeningScale();
                if (clearScale === null) { unlockPageInteraction(); return; }
                loading.style.setProperty('--community-zoom-duration', `${zoomDurationMs}ms`);
                loading.style.setProperty('--community-unlock-delay', `${zoomDurationMs * interactionUnlockProgress}ms`);
                loading.style.setProperty('--community-loader-clear-scale', String(clearScale));
                loading.style.setProperty('--community-loader-scale-20', String(1 + (clearScale - 1) * 0.08));
                loading.style.setProperty('--community-loader-scale-80', String(1 + (clearScale - 1) * 0.8));
                await waitForZoomAnimation();
                loading.classList.add('is-zoom-settled');
                loading.classList.remove('is-zooming-into-content');
                // Commit the final frame before any viewport-size correction.
                void loading.offsetWidth;
                // A viewport resize or cancelled transition can invalidate the target.
                for (let attempts = 0; attempts < 4 && !clearOpeningCoversViewport(); attempts++) {
                    clearScale = getClearOpeningScale();
                    if (clearScale === null) break;
                    await waitForZoomCorrection(clearScale);
                }
            }

            async function start() {
                try {
                    // Phase one: load the community logo and footer in order;
                    // only reveal them once both have decoded.
                    for (let i = 0; i < logoImages.length; i++) {
                        await loadImage(logoImages[i], fraction => setProgress(20 * (i + fraction) / logoImages.length));
                    }
                    const centerBackdrop = loading.querySelector('.loading-backdrop-center');
                    if (loadingLogo && centerBackdrop) {
                        try {
                            const maskUrl = await createInverseAlphaMask(loadingLogo);
                            const inverseAlphaMask = `url("${maskUrl}")`;
                            centerBackdrop.style.webkitMaskImage = inverseAlphaMask;
                            centerBackdrop.style.webkitMaskComposite = 'source-over';
                            centerBackdrop.style.maskImage = inverseAlphaMask;
                            centerBackdrop.style.maskComposite = 'add';
                        } catch (failure) {
                            console.warn('[community] Falling back to layered logo mask.', failure);
                            const logoAlphaMask = `url("${loadingLogo.src}")`;
                            const inverseAlphaMask = `linear-gradient(#000 0 0), ${logoAlphaMask}`;
                            centerBackdrop.style.webkitMaskImage = inverseAlphaMask;
                            centerBackdrop.style.webkitMaskComposite = 'xor';
                            centerBackdrop.style.maskImage = inverseAlphaMask;
                            centerBackdrop.style.maskComposite = 'exclude';
                        }
                    }
                    // The page uses the same community mark; reuse its completed
                    // loader image rather than downloading it again in phase two.
                    if (contentLogo && loadingLogo) {
                        contentLogo.src = loadingLogo.src;
                        contentLogo.removeAttribute('data-src');
                    }
                    loading.classList.add('loading-ready');

                    // Phase two: page images, then the language script and its
                    // dictionaries. Nothing in this phase starts before the logos.
                    for (let i = 0; i < contentImages.length; i++) {
                        await loadImage(contentImages[i], fraction => setProgress(20 + 80 * contentImageProgressShare * (i + fraction) / contentImages.length));
                    }
                    await initializeLanguage();
                    main.style.display = 'flex';
                    setProgress(100);

                    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    if (!reduceMotion) {
                        // Fade the bar first, then open a transparent center window.
                        await new Promise(resolve => window.setTimeout(resolve, 180));
                        await waitForFade();
                    }
                    await revealCenter(reduceMotion);
                    await zoomLoadingIntoContent(reduceMotion);
                    loading.style.display = 'none';
                } catch (failure) {
                    console.error('[community] Page loading failed.', failure);
                    main.setAttribute('inert', '');
                    main.setAttribute('aria-busy', 'true');
                    document.documentElement.classList.add('community-interaction-locked');
                    loading.classList.remove('allows-page-interaction', 'is-zooming-into-content', 'is-zoom-settled', 'is-center-revealing');
                    loading.style.display = 'flex';
                    error.hidden = false;
                    try { retry.focus({ preventScroll: true }); } catch (_) { retry.focus(); }
                }
            }

            retry.addEventListener('click', () => window.location.reload());
            window.addEventListener('pagehide', event => {
                if (event.persisted) return;
                objectUrls.forEach(url => URL.revokeObjectURL(url));
                objectUrls.clear();
            });
            document.addEventListener('DOMContentLoaded', start, { once: true });
        })();
    </script>
</body>
</html>
