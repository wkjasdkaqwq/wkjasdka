  <script>
    (function () {
      const themeKey = 'wkjasdka-dark-mode';
      const root = document.documentElement;
      const systemTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      const savedTheme = () => {
        try {
          const value = localStorage.getItem(themeKey);
          if (value === 'dark' || value === 'true') return 'dark';
          if (value === 'light' || value === 'false') return 'light';
          return 'system';
        } catch (_) {
          return 'system';
        }
      };
      const applyTheme = () => {
        const preference = savedTheme();
        const dark = preference === 'dark' || (preference === 'system' && Boolean(systemTheme && systemTheme.matches));
        root.classList.toggle('dark-mode', dark);
        root.classList.toggle('light-mode', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      applyTheme();
      window.addEventListener('storage', event => {
        if (event.key === themeKey || event.key === null) applyTheme();
      });
      if (systemTheme) {
        const onSystemThemeChange = () => {
          if (savedTheme() === 'system') applyTheme();
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', onSystemThemeChange);
        else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>

    <script>
        (function () {
            const menuButton = document.getElementById('menuBtn');
            const menuPanel = document.getElementById('menuPanel');
            const menuAnchor = menuButton.closest('.menu-anchor');
            const logoLink = document.getElementById('communityLogoLink');
            let menuTouchStartY = 0;
            const closeMenu = () => {
                menuPanel.classList.remove('open');
                menuButton.setAttribute('aria-expanded', 'false');
            };
            menuPanel.addEventListener('touchstart', event => {
                if (event.touches.length === 1) menuTouchStartY = event.touches[0].clientY;
            }, { passive: true });
            menuPanel.addEventListener('touchmove', event => {
                if (!menuPanel.classList.contains('open') || event.touches.length !== 1) return;
                const deltaY = menuTouchStartY - event.touches[0].clientY;
                const atTop = menuPanel.scrollTop <= 0;
                const atBottom = menuPanel.scrollTop + menuPanel.clientHeight >= menuPanel.scrollHeight - 1;
                const cannotScroll = menuPanel.scrollHeight <= menuPanel.clientHeight;
                if (cannotScroll || (deltaY < 0 && atTop) || (deltaY > 0 && atBottom)) event.preventDefault();
            }, { passive: false });
            menuButton.addEventListener('click', event => {
                event.stopPropagation();
                const open = menuPanel.classList.toggle('open');
                menuButton.setAttribute('aria-expanded', String(open));
            });
            document.addEventListener('click', event => {
                if (!menuAnchor.contains(event.target)) closeMenu();
            });
            document.addEventListener('pointerdown', event => {
                if (menuPanel.classList.contains('open') && !menuAnchor.contains(event.target)) closeMenu();
            }, { passive: true });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && menuPanel.classList.contains('open')) {
                    closeMenu();
                    menuButton.focus();
                }
            });
            logoLink.addEventListener('click', event => {
                event.preventDefault();
                const scrollTop = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop;
                if (scrollTop <= 0) {
                    window.location.reload();
                    return;
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        })();

        (function () {
            'use strict';
            const themeLogoImages = Array.from(document.querySelectorAll('[data-community-light-src]'));
            function syncCommunityLogoSources() {
                const dark = document.documentElement.classList.contains('dark-mode');
                themeLogoImages.forEach(image => {
                    const source = dark ? image.dataset.communityDarkSrc : image.dataset.communityLightSrc;
                    if (!source) return;
                    if (image.id === 'loadingLogo') image.setAttribute('data-src', source);
                    else image.setAttribute('src', source);
                });
            }
            syncCommunityLogoSources();
            window.addEventListener('storage', event => {
                if (event.key === 'wkjasdka-dark-mode' || event.key === null) syncCommunityLogoSources();
            });
            const loading = document.getElementById('loadingScreen');
            const main = document.getElementById('mainContent');
            const progress = document.getElementById('loadingProgress');
            const fill = document.getElementById('loadingProgressFill');
            const error = document.getElementById('loadingError');
            const retry = document.getElementById('loadingRetry');
            const loadingLogo = document.getElementById('loadingLogo');
            const logoImages = [
                loadingLogo,
                document.querySelector('.loading-footer-image')
            ];
            const contentImages = Array.from(main.querySelectorAll('img[data-src]'));
            const contentImageProgressShare = contentImages.length ? 0.5 : 0;
            const scriptProgressShare = contentImages.length ? 0.25 : 0.5;

                for (let attempts = 0; attempts < 4 && !loadingLayerCoversViewport(); attempts++) {
                    await waitForZoomCorrection(getZoomTarget(portalOpening));
                }
                await finishPortal(opening, radius);
            }

            async function zoomLoadingIntoContent(reduceMotion) {
                if (reduceMotion) { unlockPageInteraction(); return; }
                const opening = findOpaqueOpening(logoAlpha, logoLayout()) || fallbackFocus(logoAlpha);
                const target = getZoomTarget(opening);
                loading.style.setProperty('--community-zoom-duration', `${zoomDurationMs}ms`);
                loading.style.setProperty('--community-unlock-delay', `${zoomDurationMs * interactionUnlockProgress}ms`);
                setZoomTarget(target);
                loading.style.setProperty('--community-loader-scale-30', String(1 + (target.scale - 1) * 0.12));
                if (opening.mode === 'portal') {
                    setPortalRadius(opening, 0);
                    loading.classList.add('is-portal-fallback');
                }
                const animation = waitForZoomAnimation();
                const stopPortal = opening.mode === 'portal' ? followPortalDuringZoom(opening, target) : null;
                await animation;
                let portalRadius = stopPortal ? stopPortal() : 0;
                loading.classList.add('is-zoom-settled');
                loading.classList.remove('is-zooming-into-content');
                // Commit the final frame before any viewport-size correction.
                void loading.offsetWidth;
                if (opening.mode === 'alpha') {
                    for (let attempts = 0; attempts < 4 && !clearOpeningCoversViewport(opening); attempts++) {
                        await waitForZoomCorrection(getZoomTarget(opening));
                    }
                    if (!clearOpeningCoversViewport(opening)) {
                        setPortalRadius(opening, 0);
                        loading.classList.add('is-portal-fallback');
                        await finishPortalSafely(opening, 0);
                    }
                } else {
                    await finishPortalSafely(opening, portalRadius);
                }
            }

            async function start() {
                try {
                    // Phase one: load the community logo and footer in order;
                    // only reveal them once both have decoded.
                    for (let i = 0; i < logoImages.length; i++) {
                        await loadImage(logoImages[i], fraction => setProgress(20 * (i + fraction) / logoImages.length));
                    }
                    syncLogoGeometry();
                    const centerBackdrop = loading.querySelector('.loading-backdrop-center');
                    if (loadingLogo && centerBackdrop) {
                        try {
                            const mask = await createInverseAlphaMask(loadingLogo);
                            const maskUrl = mask.maskUrl;
                            logoAlpha = mask.alpha;
                            const inverseAlphaMask = `url("${maskUrl}")`;
                            centerBackdrop.style.webkitMaskImage = inverseAlphaMask;
                            centerBackdrop.style.webkitMaskComposite = 'source-over';
                            centerBackdrop.style.maskImage = inverseAlphaMask;
                            centerBackdrop.style.maskComposite = 'add';
                        } catch (failure) {
                            console.warn('[community] Falling back to layered logo mask.', failure);
                            const logoAlphaMask = `url("${loadingLogo.src}")`;
                            const inverseAlphaMask = `linear-gradient(#000 0 0), ${logoAlphaMask}`;
                            centerBackdrop.style.webkitMaskImage = inverseAlphaMask;
                            centerBackdrop.style.webkitMaskComposite = 'xor';
                            centerBackdrop.style.maskImage = inverseAlphaMask;
                            centerBackdrop.style.maskComposite = 'exclude';
                        }
                    }
                    loading.classList.add('loading-ready');

                    // Phase two: page images, then the language script and its
                    // dictionaries. Nothing in this phase starts before the logos.
                    for (let i = 0; i < contentImages.length; i++) {
                        await loadImage(contentImages[i], fraction => setProgress(20 + 80 * contentImageProgressShare * (i + fraction) / contentImages.length));
                    }
                    await initializeLanguage();
                    main.style.display = 'flex';
                    setProgress(100);

                    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    if (!reduceMotion) {
                        // Fade the bar first, then open a transparent center window.
                        await new Promise(resolve => window.setTimeout(resolve, 180));
                        await waitForFade();
                    }
                    await revealCenter(reduceMotion);
                    await zoomLoadingIntoContent(reduceMotion);
                    logoAlpha = null;
                    loading.style.display = 'none';
                } catch (failure) {
                    logoAlpha = null;
                    console.error('[community] Page loading failed.', failure);
                    main.setAttribute('inert', '');
                    main.setAttribute('aria-busy', 'true');
                    document.documentElement.classList.add('community-interaction-locked');
                    loading.classList.remove('allows-page-interaction', 'is-zooming-into-content', 'is-zoom-settled', 'is-center-revealing');
                    loading.style.display = 'flex';
                    error.hidden = false;
                    try { retry.focus({ preventScroll: true }); } catch (_) { retry.focus(); }
                }
            }

            retry.addEventListener('click', () => window.location.reload());
            window.addEventListener('pagehide', event => {
                if (event.persisted) return;
                objectUrls.forEach(url => URL.revokeObjectURL(url));
                objectUrls.clear();
            });
            document.addEventListener('DOMContentLoaded', start, { once: true });
        })();
    </script>
</body>
</html>
