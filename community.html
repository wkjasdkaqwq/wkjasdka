<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function () {
      const themeKey = 'wkjasdka-dark-mode';
      const root = document.documentElement;
      const applyTheme = () => {
        const dark = localStorage.getItem(themeKey) === 'true';
        root.classList.toggle('dark-mode', dark);
        root.classList.toggle('light-mode', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      applyTheme();
      window.addEventListener('storage', event => {
        if (event.key === themeKey || event.key === null) applyTheme();
      });
    })();
  </script>
    <title>Semi-rounded Corner on Liuyanlin Community</title>
    <style>
::selection {
  background: #E67E22;
  color: #fff;
}
::-moz-selection {
  background: #E67E22;
  color: #fff;
}
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #fff;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #mainContent {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: 100vh;
            padding: 40px;
        }

        .content-box {
            width: min(800px, 100%);
            text-align: center;
        }

        .community-logo {
            display: block;
            width: min(300px, 62vw);
            height: auto;
            margin: 0 auto 28px;
        }

        .page-title {
            margin: 0;
            font-size: 3rem;
            color: #333;
        }

        .page-description {
            margin: 18px 0 0;
            font-size: 1.2rem;
            color: #666;
        }

        .placeholder-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-top: 40px;
        }

        .placeholder-item {
            height: 150px;
            border-radius: 12px;
            background: #f5f5f5;
        }

        @media (max-width: 640px) {
            #mainContent {
                padding: 28px 20px;
            }

            .page-title {
                font-size: 2.25rem;
            }

            .placeholder-grid {
                grid-template-columns: 1fr;
            }
        }
        html.dark-mode,
        html.dark-mode body {
            background: #07121C;
            color: #e0e0e0;
        }

        html.dark-mode .page-title {
            color: #e0e0e0;
        }

        html.dark-mode .page-description {
            color: #a0a0a0;
        }

        html.dark-mode .placeholder-item {
            background: #0f1f2e;
        }
    </style>
</head>
<body>
    <main id="mainContent">
        <div class="content-box">
            <img
                class="community-logo"
                src="/wkjasdka/index/community2.png"
                alt="LIUYANLIN COMMUNITY"
            >

            <h1 class="page-title">测试</h1>
            <p class="page-description">这是一个 Community 前端页面测试</p>

            <div class="placeholder-grid">
                <div class="placeholder-item"></div>
                <div class="placeholder-item"></div>
                <div class="placeholder-item"></div>
            </div>
        </div>
    </main>
</body>
</html>
