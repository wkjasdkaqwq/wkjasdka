<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
    (function () {
      const themeKey = 'wkjasdka-dark-mode';
      const root = document.documentElement;
      const systemTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      const savedTheme = () => {
        try {
          const value = localStorage.getItem(themeKey);
          if (value === 'dark' || value === 'true') return 'dark';
          if (value === 'light' || value === 'false') return 'light';
          return 'system';
        } catch (_) {
          return 'system';
        }
      };
      const applyTheme = () => {
        const preference = savedTheme();
        const dark = preference === 'dark' || (preference === 'system' && Boolean(systemTheme && systemTheme.matches));
        root.classList.toggle('dark-mode', dark);
        root.classList.toggle('light-mode', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      applyTheme();
      window.addEventListener('storage', event => {
        if (event.key === themeKey || event.key === null) applyTheme();
      });
      if (systemTheme) {
        const onSystemThemeChange = () => {
          if (savedTheme() === 'system') applyTheme();
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', onSystemThemeChange);
        else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>
  <title data-i18n="documentTitle">About - Echo</title>
  <link rel="icon" href="/wkjasdka/index/echo logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
::selection {
  background: #E67E22;
  color: #fff;
}
::-moz-selection {
  background: #E67E22;
  color: #fff;
}
    :root { font-family: system-ui, sans-serif; }
    button, input, select, textarea { font-family: inherit; }
    /* 全局样式 */
    * {
      box-sizing: border-box;
    }

    /* 导航栏样式 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #d7d7d7;
      height: 4.125rem;
      box-sizing: border-box;
      padding: 0;
      line-height: normal;
      z-index: 9000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.4s ease-out;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .navbar.hidden {
      transform: translateY(-100%);
    }
    
    .navbar-container {
      width: 100%;
      height: auto;
      margin: 0 auto;
      padding: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .navbar-logo {
      height: 2.25rem;
      width: auto;
      margin-right: 0.9375rem;
      cursor: pointer;
    }
    
    .navbar-logo:hover {
      transform: scale(1.05);
    }

    .logo-text {
      font-size: 1.5rem;
      line-height: normal;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
    }

    .logo-container {
      display: flex;
      align-items: center;
      margin-left: 1rem;
    }

    /* 菜单按钮 */
    .menu-btn {
      display: none;
      position: absolute;
      top: 0;
      right: 0.625rem;
      bottom: 0;
      width: 3.125rem;
      height: 3.125rem;
      margin: auto 0;
      padding: 0;
      border: none;
      box-sizing: border-box;
      overflow: visible;
      background: transparent;
      color: #333;
      cursor: pointer;
      transform: none;
      transform-origin: center center;
      z-index: 9001;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-btn .line { position: absolute; display: block; left: 0.625rem; width: 1.875rem; height: 0.1875rem; box-sizing: border-box; background-color: #333; border-radius: 0.125rem; transform-origin: center center; }
    .menu-btn:not(.rotated) { transition: transform 0.35s ease-out; }
    .menu-btn:not(.rotated) .line { transition: all 0.35s ease-out; }
    .menu-btn.rotated { transition: transform 0.25s cubic-bezier(0.215, 0.61, 0.355, 1); transform: rotate(90deg); }
    .menu-btn.rotated .line { transition: all 0.25s cubic-bezier(0.215, 0.61, 0.355, 1); transform-origin: center; }
    .menu-btn.dragging { transition: none !important; transform: rotate(var(--menu-open-angle, 0deg)); }
    .menu-btn.dragging .line { transition: none !important; }
    .menu-btn:focus-visible { outline: 2px solid #64b5f6; outline-offset: 3px; }
    .menu-btn .line1 { top: calc(50% - 0.71875rem); transition-delay: 0.02s; }
    .menu-btn .line2 { top: calc(50% - 0.09375rem); transition-delay: 0.04s; }
    .menu-btn .line3 { bottom: calc(50% - 0.71875rem); transition-delay: 0.06s; }
    .sidebar { touch-action: pan-y; }

    /* 加载层样式 */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-screen,
    .loading-screen * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      user-select: none !important;
    }

    /* 加载层内容容器，默认隐藏 */
    .loading-content {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    /* 当 Logo 加载完成后显示 */
    .loading-content.visible {
      display: flex;
    }

    .loading-ready .loading-text-container {
      display: flex !important;
    }

    .loading-screen.hidden {
      display: none;
    }

    .loading-logo {
      display: none;
      width: 65px;
      height: auto;
    }

    #loadingLogoDark { display: none; }
    .loading-ready #loadingLogoLight { display: block; }
    html.dark-mode .loading-ready #loadingLogoLight { display: none; }
    html.dark-mode .loading-ready #loadingLogoDark { display: block; }

    .loading-text-container {
      position: fixed !important;
      bottom: env(safe-area-inset-bottom, 26px) !important;
      left: 0 !important;
      width: 100% !important;
      display: none !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 10001 !important;
      visibility: visible !important;
      pointer-events: none !important;
      -webkit-text-size-adjust: 100% !important;
      transform: translateY(-32px) !important;
    }

    .loading-footer-image { display: block; width: 5.85rem; max-width: 54vw; max-height: 2.6625rem; height: auto; object-fit: contain; }

    /* 页脚样式 */
    footer {
      height: 60px;
      background-color: #f5f5f5;
      margin-top: auto;
      border-top: 1px solid #ccc;
      z-index: 8000;
      position: relative;
    }

    /* 页面容器 */
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    /* 侧边栏样式 */
    .sidebar {
      position: fixed;
      left: 0;
      top: 66px;
      width: 25%;
      bottom: 0;
      background-color: transparent;
      padding-top: 1.875rem;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 7000;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      top: 1.875rem;
      right: 0;
      bottom: 0;
      left: 0;
      background-color: #f9f9f9;
      z-index: 0;
      pointer-events: none;
    }

    /* 背景竖线 */
    .sidebar::after {
      content: "";
      position: absolute;
      right: 0;
      top: calc(1.875rem + 1px);
      bottom: 0;
      width: 1px;
      background-color: #ccc;
      z-index: 1;
    }

    /* 侧边栏组 */
    .sidebar-group {
      position: relative;
      z-index: 2;
    }

    /* 侧边栏项 */
    .sidebar-item {
      padding: 15px 25px;
      font-size: 18px;
      color: #333;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background-color: #f0f0f0;
      border-right: 1px solid #ccc;
      transition: background-color 0.3s, padding-left 0.3s, transform 0.1s;
      z-index: 5;
      -webkit-tap-highlight-color: transparent;
    }

    .sidebar-item:hover {
      background-color: #eaeaea;
      padding-left: 30px;
    }

    .sidebar-item:active {
      background-color: #d0d0d0;
      transform: scale(0.98);
    }

    .sidebar-item.active, .sidebar-item.expanded {
      background-color: #e0e0e0;
      font-weight: bold;
      border-right-color: #e0e0e0;
    }

    /* 展开/收起箭头 */
    .sidebar-item.expandable::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 14px;
      transition: transform 0.3s ease;
    }

    .sidebar-item.expandable.expanded::after {
      transform: translateY(-50%) rotate(180deg);
    }

    /* 子项容器 */
    .sidebar-submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s cubic-bezier(0, 1, 0, 1);
      background-color: #d7d7d7;
      position: relative;
      z-index: 4;
    }

    .sidebar-submenu.expanded {
      max-height: 500px;
      transition: max-height 0.3s ease-in-out;
      border-right: 1px solid #d7d7d7;
    }

    /* 子项样式 */
    .sidebar-subitem {
      padding: 15px 25px 15px 50px;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      position: relative;
      border-right: 1px solid #d7d7d7;
      transition: background-color 0.3s, padding-left 0.3s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .sidebar-subitem:hover {
      background-color: rgba(0,0,0,0.05);
      padding-left: 55px;
    }

    .sidebar-subitem:active {
      transform: scale(0.98);
    }

    .sidebar-subitem.active {
      background-color: rgba(0,0,0,0.1);
      font-weight: bold;
      border-right-color: transparent;
    }

    /* 主内容区域样式 */
    .main-content {
      margin-left: 25%;
      margin-top: 82px;
      padding: 40px 60px;
      flex: 1;
      min-height: calc(100vh - 82px - 60px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      text-align: left;
      background: #ffffff;
    }

    /* 移动端内容带淡入淡出动画 */
    @media (max-width: 768px) {
      .main-content {
        opacity: 1;
        transition: opacity 0.5s ease;
      }

      .main-content.fade-out {
        opacity: 0;
      }
    }

    /* 内容区块样式 */
    .content-section h2 {
      color: #2c3e50;
      font-size: 28px;
      font-weight: 600;
      border-bottom: 3px solid #d7d7d7;
      padding-bottom: 15px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .content-section p {
      color: #34495e;
      margin-bottom: 1.5em;
      font-size: 16px;
      line-height: 1.8;
    }

    .info-box {
      background-color: #f5f8fa;
      border-left: 4px solid #d7d7d7;
      padding: 20px 25px;
      margin: 20px 0;
      border-radius: 4px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 25px 0;
    }

    .grid-item {
      background-color: #f9f9f9;
      padding: 25px;
      border-radius: 6px;
      border: 1px solid #e8e8e8;
    }

    /* ========== 移动端适配 (768px 及以下) ========== */
    @media (max-width: 768px) {
      /* 导航栏调整 */
      .navbar {
        height: 3.75rem;
      }

      .navbar-logo {
        height: 1.75rem;
        margin-right: 10px;
      }

      .logo-text {
        font-size: 1.1rem;
      }

      /* 显示菜单按钮 */
      .menu-btn {
        display: block;
      }

      /* 加载页 Logo 缩小到 35px */
      .loading-logo {
        width: 35px;
        height: auto;
      }

      /* 侧边栏改为抽屉式菜单 */
      .sidebar {
        position: fixed;
        left: auto;
        right: 0;
        top: 3.75rem;
        width: 70%;
        max-width: 280px;
        height: calc(100vh - 3.75rem);
        padding-top: 0;
        background-color: transparent;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        overflow-y: auto;
        z-index: 6000;
        box-shadow: -2px 0 5px rgba(0,0,0,0.1);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .sidebar.dragging { transform: translate3d(var(--sidebar-drag-offset, 100%), 0, 0); transition: none !important; }

      .sidebar::after {
        display: none;
      }

      .sidebar::before {
        top: 0;
      }

      /* 侧边栏项调整 */
      .sidebar-item {
        padding: 15px 25px;
        font-size: 1.1rem;
        line-height: normal;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }

      .sidebar-item:hover {
        padding-left: 30px;
      }

      .sidebar-item.expandable::after {
        right: 20px;
      }

      .sidebar-subitem {
        padding: 15px 25px 15px 50px;
        font-size: 1rem;
        line-height: normal;
        border-right: none;
        border-bottom: 1px solid #e8e8e8;
      }

      .sidebar-subitem:hover {
        padding-left: 30px;
      }

      /* 主内容区域调整 */
      .main-content {
        margin-left: 0;
        margin-top: 4.375rem;
        padding: 20px 15px;
        min-height: calc(100vh - 4.375rem - 3.75rem);
      }

      /* 内容区块调整 */
      .content-section h2 {
        font-size: 22px;
        padding-bottom: 10px;
        margin-bottom: 15px;
      }

      .content-section p {
        font-size: 14px;
        margin-bottom: 1em;
      }

      .info-box {
        padding: 15px 20px;
        margin: 15px 0;
      }

      .content-grid {
        grid-template-columns: 1fr;
        gap: 15px;
        margin: 15px 0;
      }

      .grid-item {
        padding: 20px;
      }

      .grid-item h3 {
        font-size: 16px;
        margin-top: 0;
      }

      /* 页脚调整 */
      footer {
        height: 50px;
      }
    }

    /* Keep navbar sizing aligned with settings.html above its 600px breakpoint. */
    @media (min-width: 601px) and (max-width: 768px) {
      .navbar { height: 4.125rem; }
      .navbar-logo { height: 2.25rem; }
      .logo-text { font-size: 1.5rem; }
      .sidebar { top: 4.125rem; height: calc(100vh - 4.125rem); }
      .main-content { margin-top: 5.125rem; min-height: calc(100vh - 5.125rem - 3.75rem); }
    }

    /* ========== 超小屏幕适配 (480px 及以下) ========== */
    @media (max-width: 480px) {
      .navbar-logo {
        height: 1.75rem;
        margin-right: 8px;
      }

      .logo-text {
        font-size: 1.1rem;
      }

      .menu-btn {
        padding: 0;
      }

      .loading-logo {
        width: 35px;
      }

      .sidebar {
        top: 3.75rem;
        height: calc(100vh - 3.75rem);
      }

      .main-content {
        margin-top: 4.375rem;
        padding: 15px 10px;
        min-height: calc(100vh - 4.375rem - 3.125rem);
      }

      .content-section h2 {
        font-size: 18px;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }

      .content-section p {
        font-size: 13px;
      }

      .sidebar-item {
        padding: 15px 25px;
        font-size: 1.1rem;
        line-height: normal;
      }

      .sidebar-subitem {
        padding: 15px 25px 15px 50px;
        font-size: 1rem;
        line-height: normal;
      }

      .grid-item {
        padding: 15px;
      }

      .grid-item h3 {
        font-size: 14px;
      }
    }

    /* 遮罩层 */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 5999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .sidebar-overlay.dragging { transition: none !important; }

    /* 首页同款系统深色主题 */
    html.dark-mode { color-scheme: dark; }
    html.dark-mode body { background-color: #07121C !important; color: #e0e0e0 !important; }
    html.dark-mode .navbar { background-color: #0f1f2e !important; box-shadow: 0 2px 5px rgba(0,0,0,.5) !important; }
    html.dark-mode .navbar-logo { filter: brightness(0) invert(1); }
    html.dark-mode .navbar-logo:hover { opacity: .82; }
    html.dark-mode .logo-text, html.dark-mode .menu-btn { color: #e0e0e0 !important; }
    html.dark-mode .menu-btn .line { background-color: #e0e0e0 !important; }
    html.dark-mode .sidebar { background-color: transparent !important; box-shadow: -2px 0 10px rgba(0,0,0,.7) !important; }
    html.dark-mode .sidebar::before { background-color: #07121C !important; }
    html.dark-mode .sidebar::after { top: calc(1.875rem + 0.5rem); background-color: #1a2a3a !important; }
    html.dark-mode .sidebar-item { background-color: #0f1f2e !important; color: #e0e0e0 !important; border-right-color: #1a2a3a !important; }
    html.dark-mode .sidebar-item:hover { background-color: #1a2a3a !important; }
    html.dark-mode .sidebar-item:active { background-color: #0a1420 !important; }
    html.dark-mode .sidebar-item.active, html.dark-mode .sidebar-item.expanded { background-color: #1a2a3a !important; border-right-color: #1a2a3a !important; }
    html.dark-mode .sidebar-item.expandable::after { color: #b0b0b0 !important; }
    html.dark-mode .sidebar-submenu { background-color: #0a1420 !important; }
    html.dark-mode .sidebar-submenu.expanded { border-right-color: #1a2a3a !important; }
    html.dark-mode .sidebar-subitem { color: #e0e0e0 !important; border-right-color: #1a2a3a !important; }
    html.dark-mode .sidebar-subitem:hover { background-color: #1a2a3a !important; }
    html.dark-mode .sidebar-subitem:active { background-color: #0f1f2e !important; }
    html.dark-mode .sidebar-subitem.active { background-color: rgba(255,255,255,.08) !important; border-right-color: transparent !important; }
    html.dark-mode .main-content { background-color: #07121C !important; color: #e0e0e0 !important; }
    html.dark-mode .content-section h2 { color: #e0e0e0; border-bottom-color: #1a2a3a; }
    html.dark-mode .content-section p { color: #a0a0a0; }
    html.dark-mode .info-box { background-color: #0f1f2e !important; border-left-color: #e67e22 !important; }
    html.dark-mode .info-box p { color: #a0a0a0 !important; }

    html.dark-mode .main-content a { color: #64b5f6; }
    html.dark-mode .main-content a:hover { color: #90caf9; }
    html.dark-mode footer { background-color: #0d1a26 !important; border-top-color: #1a2a3a !important; color: #a0a0a0 !important; }
    html.dark-mode .loading-screen { background-color: #07121C !important; }
    html.dark-mode .loading-footer-image { filter: invert(1); }
    html.dark-mode .sidebar-overlay { background-color: rgba(0,0,0,.7) !important; }
    html.dark-mode .sidebar::-webkit-scrollbar-track { background: #0d1a26; }
    html.dark-mode .sidebar::-webkit-scrollbar-thumb { background: #1a2a3a; }
    html.dark-mode .sidebar::-webkit-scrollbar-thumb:hover { background: #2a3a4a; }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <div class="logo-container">
        <img src="index/echo logo.png" alt="Echo logo" data-i18n-alt="echoLogoAlt" class="navbar-logo" id="logo">

      <button class="menu-btn" id="menuBtn" type="button" aria-label="Toggle menu" data-i18n-aria-label="menuToggle" aria-controls="sidebar" aria-expanded="false">
        <span class="line line1"></span>
        <span class="line line2"></span>
        <span class="line line3"></span>
      </button>
    </div>
  </nav>

  <!-- 侧边栏遮罩 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 左侧选项栏 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-group">
      <div class="sidebar-item expandable" data-expandable="group-echo">
        Echo
      </div>
      <div class="sidebar-submenu" id="group-echo">
        <div class="sidebar-subitem" data-content="echo">Echo</div>
        <div class="sidebar-subitem" data-content="wkjasdka">W.K.Jasdka</div>
        <div class="sidebar-subitem" data-content="liuyanlin">Liuyanlin</div>
      </div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="contact" data-i18n="contactNav">Contact</div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="privacy" data-i18n="privacyNav">Privacy policy</div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="terms" data-i18n="termsNav">User agreement</div>
    </div>
  </div>

  <!-- 主内容区域 -->
  <div class="main-content" id="mainContent"></div>

  <!-- 加载层 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-content" id="loadingContent">
      <img src="index/logo3.png" alt="Loading logo" data-i18n-alt="loadingLogoAlt" class="loading-logo" id="loadingLogoLight">
      <img src="index/dark_mode.png" alt="Loading logo" data-i18n-alt="loadingLogoAlt" class="loading-logo" id="loadingLogoDark">
      <div class="loading-text-container" id="loadingTexts" aria-hidden="false">
        <img class="loading-footer-image" src="index/under%20logo.png" alt="from - Wkjasdka -">
      </div>
    </div>
  </div>

  <footer></footer>

  <script src="./scripts/i18n.js"></script>
  <script>
    const navbar = document.getElementById('navbar');
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuBtn');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    SiteI18n.init({ namespace: 'about', defaultLocale: 'en' })
      .catch(error => console.error('[about] Could not initialize translations.', error));
    let lastScrollTop = 0;
    let navbarAutoHideHoldUntil = 0;
    let menuTouchStart = null;
    let suppressNextOverlayClick = false;
    let overlayClickSuppressionTimer = null;

    function currentScrollTop() {
      return window.pageYOffset || document.documentElement.scrollTop || 0;
    }

    function keepNavbarVisible(duration = 0) {
      navbar.classList.remove('hidden');
      navbarAutoHideHoldUntil = Math.max(navbarAutoHideHoldUntil, performance.now() + duration);
      lastScrollTop = currentScrollTop();
    }

    function isAnySubmenuExpanded() {
      return document.querySelectorAll('.sidebar-submenu.expanded').length > 0;
    }

    function syncPageScrollLock() {
      document.body.style.overflow = sidebar.classList.contains('active') || isAnySubmenuExpanded() ? 'hidden' : '';
    }

    function disableScroll() {
      syncPageScrollLock();
    }

    function enableScroll() {
      syncPageScrollLock();
    }

    function clearSidebarDragStyles() {
      sidebar.classList.remove('dragging');
      sidebar.style.removeProperty('--sidebar-drag-offset');
      sidebarOverlay.classList.remove('dragging');
      sidebarOverlay.style.removeProperty('opacity');
      menuBtn.classList.remove('dragging');
      menuBtn.style.removeProperty('--menu-open-angle');
    }

    function setSidebarOpenState(isOpen) {
      if (isOpen) {
        menuBtn.classList.remove('rotated');
        void menuBtn.offsetWidth;
        menuBtn.classList.add('rotated');
        sidebar.classList.add('active');
        sidebarOverlay.classList.add('active');
        menuBtn.setAttribute('aria-expanded', 'true');
      } else {
        sidebar.classList.remove('active');
        sidebarOverlay.classList.remove('active');
        menuBtn.classList.remove('rotated');
        menuBtn.setAttribute('aria-expanded', 'false');
      }
      syncPageScrollLock();
    }

    function closeSidebar() {
      clearSidebarDragStyles();
      setSidebarOpenState(false);
      keepNavbarVisible(650);
    }

    function openSidebar() {
      if (sidebar.classList.contains('active')) return;
      clearSidebarDragStyles();
      keepNavbarVisible(650);
      setSidebarOpenState(true);
    }

    function toggleSidebar() {
      if (sidebar.classList.contains('active')) closeSidebar();
      else openSidebar();
    }

    menuBtn.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', event => {
      if (suppressNextOverlayClick) {
        event.preventDefault();
        suppressNextOverlayClick = false;
        if (overlayClickSuppressionTimer !== null) window.clearTimeout(overlayClickSuppressionTimer);
        overlayClickSuppressionTimer = null;
        return;
      }
      closeSidebar();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && sidebar.classList.contains('active')) {
        event.preventDefault();
        closeSidebar();
      }
    });

    window.addEventListener('scroll', () => {
      const scrollTop = currentScrollTop();
      if (sidebar.classList.contains('active') || performance.now() < navbarAutoHideHoldUntil) {
        navbar.classList.remove('hidden');
      } else if (scrollTop > lastScrollTop && scrollTop > 50) {
        navbar.classList.add('hidden');
      } else {
        navbar.classList.remove('hidden');
      }
      lastScrollTop = scrollTop;
    });

    function isBlankMenuSwipeArea(target) {
      const element = target instanceof Element ? target : target && target.parentElement;
      if (!element) return false;
      return !element.closest('a, button, input, select, textarea, summary, [role="button"], [contenteditable="true"], h1, h2, h3, p, span, img, hr, footer, .loading-screen, .info-box, .grid-item, .sidebar, .navbar');
    }

    function clampSidebarOffset(offset, width) {
      return Math.min(width, Math.max(0, offset));
    }

    function updateSidebarDrag(start, touch) {
      const deltaX = touch.clientX - start.x;
      start.offset = clampSidebarOffset(start.startedOpen ? deltaX : start.width + deltaX, start.width);
      const progress = 1 - start.offset / start.width;
      sidebar.style.setProperty('--sidebar-drag-offset', `${start.offset}px`);
      sidebarOverlay.style.opacity = String(progress);
      menuBtn.style.setProperty('--menu-open-angle', `${progress * 90}deg`);
    }

    function settleSidebarDrag(shouldOpen) {
      setSidebarOpenState(shouldOpen);
      keepNavbarVisible(650);
      clearSidebarDragStyles();
    }

    document.addEventListener('touchstart', event => {
      if (window.innerWidth > 768 || !event.touches.length) return;
      const touch = event.touches[0];
      const startedOpen = sidebar.classList.contains('active');
      const rightEdgeSwipeWidth = 3 * parseFloat(getComputedStyle(document.documentElement).fontSize);
      const startsAtRightEdge = touch.clientX >= window.innerWidth - rightEdgeSwipeWidth;
      const canOpenFromBlank = !startedOpen && !startsAtRightEdge && isBlankMenuSwipeArea(event.target);
      const canCloseFromOpenArea = startedOpen && (sidebar.contains(event.target) || sidebarOverlay.contains(event.target));
      if (!canOpenFromBlank && !canCloseFromOpenArea) {
        menuTouchStart = null;
        return;
      }

      const width = sidebar.getBoundingClientRect().width;
      menuTouchStart = {
        x: touch.clientX,
        y: touch.clientY,
        lastX: touch.clientX,
        lastTime: performance.now(),
        width,
        offset: startedOpen ? 0 : width,
        velocity: 0,
        startedOpen,
        startedOnOverlay: startedOpen && sidebarOverlay.contains(event.target),
        dragging: false
      };
    }, { passive: true });

    document.addEventListener('touchmove', event => {
      if (!menuTouchStart || !event.touches.length || window.innerWidth > 768) return;
      const start = menuTouchStart;
      const touch = event.touches[0];
      const deltaX = touch.clientX - start.x;
      const deltaY = touch.clientY - start.y;

      if (!start.dragging) {
        if (Math.abs(deltaX) < 6) return;
        if (Math.abs(deltaY) > Math.abs(deltaX) * 1.15) {
          menuTouchStart = null;
          return;
        }
        const movingTowardOpen = start.startedOpen ? deltaX > 0 : deltaX < 0;
        if (!movingTowardOpen) {
          menuTouchStart = null;
          return;
        }

        start.dragging = true;
        start.width = sidebar.getBoundingClientRect().width;
        sidebar.classList.add('dragging');
        sidebarOverlay.classList.add('dragging', 'active');
        menuBtn.classList.add('dragging');
        keepNavbarVisible(650);
      }

      event.preventDefault();
      const now = performance.now();
      const elapsed = Math.max(1, now - start.lastTime);
      start.velocity = (touch.clientX - start.lastX) / elapsed;
      start.lastX = touch.clientX;
      start.lastTime = now;
      updateSidebarDrag(start, touch);
    }, { passive: false });

    function finishMenuTouch(event) {
      if (!menuTouchStart) return;
      const start = menuTouchStart;
      menuTouchStart = null;
      if (!start.dragging) return;

      const touch = event.changedTouches && event.changedTouches[0];
      if (touch) updateSidebarDrag(start, touch);
      const projectedOffset = clampSidebarOffset(start.offset + start.velocity * 180, start.width);
      settleSidebarDrag(projectedOffset < start.width * 0.5);
      if (start.startedOnOverlay && event.type === 'touchend') {
        suppressNextOverlayClick = true;
        if (overlayClickSuppressionTimer !== null) window.clearTimeout(overlayClickSuppressionTimer);
        overlayClickSuppressionTimer = window.setTimeout(() => {
          suppressNextOverlayClick = false;
          overlayClickSuppressionTimer = null;
        }, 400);
      }
    }

    document.addEventListener('touchend', finishMenuTouch, { passive: true });
    document.addEventListener('touchcancel', finishMenuTouch, { passive: true });

    const contentData = {
      "echo": {
        body: `<div class="content-section"><h2 data-i18n="echoTitle">What is Echo?</h2><p data-i18n="echoBody">Content</p><div class="info-box"><p><strong data-i18n="statusLabel">Current status:</strong> <span data-i18n="statusText">The project is actively being developed, with its core features continuously improving.</span></p></div></div>`
      },
      "wkjasdka": {
        body: `<div class="content-section"><h2 data-i18n="wkjasdkaTitle">What is W.K.Jasdka?</h2><p data-i18n="placeholderContent">Content</p><div class="content-grid"><div class="grid-item"><h3 data-i18n="placeholderTitle">Section title</h3><p data-i18n="placeholderContent">Content</p></div><div class="grid-item"><h3 data-i18n="placeholderTitle">Section title</h3><p data-i18n="placeholderContent">Content</p></div></div></div>`
      },
      "liuyanlin": {
        body: `<div class="content-section"><h2 data-i18n="liuyanlinTitle">What is Liuyanlin?</h2><p data-i18n="placeholderContent">Content</p></div>`
      },
      "contact": {
        body: `<div class="content-section"><h2 data-i18n="contactTitle">Contact us</h2><p data-i18n="contactIntro">If you have any questions, please contact us through the following channel:</p><div class="content-grid"><div class="grid-item"><h3 data-i18n="emailTitle">📧 Email</h3><p><strong><a href="mailto:wkjasdkayeah@yeah.net">wkjasdkayeah@yeah.net</a></strong></p></div></div></div>`
      },
      "privacy": {
        body: `<div class="content-section"><h2 data-i18n="privacyTitle">Privacy policy</h2><p data-i18n="placeholderContent">Content</p></div>`
      },
      "terms": {
        body: `<div class="content-section"><h2 data-i18n="termsTitle">User agreement</h2><p data-i18n="placeholderContent">Content</p></div>`
      }
    };

    const mainContent = document.getElementById('mainContent');
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingContent = document.getElementById('loadingContent');
    const loadingLogoLight = document.getElementById('loadingLogoLight');
    const loadingLogoDark = document.getElementById('loadingLogoDark');
    const activeLoadingLogo = document.documentElement.classList.contains('dark-mode') ? loadingLogoDark : loadingLogoLight;

    function setMainContent(markup) {
      mainContent.innerHTML = markup;
      SiteI18n.apply(mainContent, { namespace: 'about' });
    }

    // 移动端欢迎页模板
    const mobileWelcomeTemplate = `
      <div class="content-section">
        <h2 data-i18n="welcomeTitle" style="text-align: center; font-size: 28px; margin-bottom: 30px; color: #E67E22;">Welcome to Echo</h2>
        <div class="info-box" style="background-color: #f0f8ff; border-left-color: #E67E22; text-align: center;">
          <p style="font-size: 16px; line-height: 1.8; color: #333;">
            <strong data-i18n="welcomeSupport">About Echo or get help and support</strong><br><br>
            <span data-i18n="welcomeIntro">Welcome to the Echo About page.</span><br>
          </p>
        </div>
        <div class="content-grid" style="margin-top: 40px;">
          <div class="grid-item" style="text-align: center;">
            <h3 style="font-size: 18px; color: #E67E22;">Echo</h3>
            <p data-i18n="platformOverview">Echo manages the W.K.Jasdka and Liuyanlin platforms.</p>
            <p data-i18n="platformLegal">Both platforms are maintained by the same team and belong to the same legal operating entity.</p>
          </div>
          <div class="grid-item" style="text-align: center;">
            <h3 data-i18n="placeholderTitle" style="font-size: 18px; color: #E67E22;">Section title</h3>
            <p data-i18n="placeholderContent">Content</p>
          </div>
          <div class="grid-item" style="text-align: center;">
            <h3 data-i18n="placeholderTitle" style="font-size: 18px; color: #E67E22;">Section title</h3>
            <p data-i18n="placeholderContent">Content</p>
          </div>
        </div>
      </div>
    `;

    // 加载页 Logo 加载逻辑
    function showLoadingContent() {
      loadingScreen.classList.add('loading-ready');
      loadingContent.classList.add('visible');
    }

    function waitForLoadingImage(image) {
      return new Promise(resolve => {
        if (!image) {
          resolve(false);
          return;
        }
        const finish = () => resolve(image.naturalWidth > 0);
        if (image.complete) {
          finish();
          return;
        }
        image.addEventListener('load', finish, { once: true });
        image.addEventListener('error', () => resolve(false), { once: true });
      });
    }

    Promise.all([
      waitForLoadingImage(activeLoadingLogo),
      waitForLoadingImage(loadingScreen.querySelector('.loading-footer-image'))
    ]).then(([centerReady, footerReady]) => {
      if (centerReady && footerReady) showLoadingContent();
    });

    // 初始化页面显示逻辑
    function initializeContent() {
      // 检查是否是移动端
      const isMobile = window.innerWidth <= 768;
      if (isMobile) {
        // 移动端默认显示欢迎页
        setMainContent(mobileWelcomeTemplate);
      }
      // 桌面端保持空白，不执行任何操作
    }

    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeContent);
    } else {
      initializeContent();
    }

    // 1. 可展开项点击
    document.querySelectorAll('.sidebar-item.expandable').forEach(item => {
      item.addEventListener('click', function() {
        const submenuId = this.dataset.expandable;
        const submenu = document.getElementById(submenuId);

        this.classList.toggle('expanded');
        submenu.classList.toggle('expanded');

        // 根据是否有任何展开的二级菜单来控制滚动
        if (isAnySubmenuExpanded()) {
          disableScroll();
        } else {
          enableScroll();
        }
      });
    });

    // 2. 子项点击
    document.querySelectorAll('.sidebar-subitem').forEach(item => {
      item.addEventListener('click', function() {
        const contentKey = this.dataset.content;
        const isActive = this.classList.contains('active');
        const isMobile = window.innerWidth <= 768;

        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));

        // 仅移动端添加淡出效果
        if (isMobile) {
          mainContent.classList.add('fade-out');
        }
        
        const updateContent = () => {
          if (isActive) {
            // 重复点击：移动端返回欢迎页，桌面端保持空白
            if (isMobile) {
              setMainContent(mobileWelcomeTemplate);
            } else {
              mainContent.innerHTML = '';
            }
          } else {
            this.classList.add('active');
            this.closest('.sidebar-submenu').previousElementSibling.classList.add('active');
            if (contentData[contentKey]) setMainContent(contentData[contentKey].body);
          }
          
          // 移动端移除淡出效果，触发淡入
          if (isMobile) {
            mainContent.classList.remove('fade-out');
          }
        };
        
        if (isMobile) {
          setTimeout(updateContent, 500);
        } else {
          updateContent();
        }
        
        // 移动端关闭菜单
        if (isMobile) {
          closeSidebar();
        }
      });
    });

    // 3. 普通项点击
    document.querySelectorAll('.sidebar-item:not(.expandable)').forEach(item => {
      item.addEventListener('click', function() {
        const contentKey = this.dataset.content;
        const isActive = this.classList.contains('active');
        const isMobile = window.innerWidth <= 768;

        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));

        // 仅移动端添加淡出效果
        if (isMobile) {
          mainContent.classList.add('fade-out');
        }
        
        const updateContent = () => {
          if (isActive) {
            // 重复点击：移动端返回欢迎页，桌面端保持空白
            if (isMobile) {
              setMainContent(mobileWelcomeTemplate);
            } else {
              mainContent.innerHTML = '';
            }
          } else {
            this.classList.add('active');
            if (contentData[contentKey]) setMainContent(contentData[contentKey].body);
          }
          
          // 移动端移除淡出效果，触发淡入
          if (isMobile) {
            mainContent.classList.remove('fade-out');
          }
        };
        
        if (isMobile) {
          setTimeout(updateContent, 500);
        } else {
          updateContent();
        }
        
        // 移动端关闭菜单
        if (isMobile) {
          closeSidebar();
        }
      });
    });

    // 确保资源完全加载后关闭加载页
    window.addEventListener('load', function() {
      loadingScreen.classList.add('hidden');
    });
  </script>
</body>
</html>
