<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 - Echo</title>
  <link rel="icon" href="/wkjasdka/index/echo logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 全局样式 */
    * {
      box-sizing: border-box;
    }

    ::selection {
      background: #E67E22;
      color: white;
    }
    ::-moz-selection {
      background: #E67E22;
      color: white;
    }

    /* 导航栏样式 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #d7d7d7;
      padding: 0;
      height: 73.5px;
      z-index: 9000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.4s ease-out;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .navbar.hidden {
      transform: translateY(-100%);
    }
    
    .navbar-container {
      width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .navbar-logo {
      height: 65px;
      width: auto;
      margin-right: 15px;
      cursor: pointer;
    }
    
    .navbar-logo:hover {
      transform: scale(1.05);
    }

    .logo-text {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    /* 菜单按钮 */
    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      color: #333;
      cursor: pointer;
      padding: 10px;
      -webkit-tap-highlight-color: transparent;
    }

    /* 加载层样式 */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* 加载层内容容器，默认隐藏 */
    .loading-content {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    /* 当 Logo 加载完成后显示 */
    .loading-content.visible {
      display: flex;
    }

    .loading-screen.hidden {
      display: none;
    }

    .loading-logo {
      width: 65px; 
      height: auto;
    }

    .loading-text-container {
      position: absolute;
      bottom: 32px;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 0;
    }

    .loading-text {
      color: #6a6a6a;
      font-size: 16px;
      margin: 5px 0;
    }

    /* 页脚样式 */
    footer {
      height: 60px;
      background-color: #f5f5f5;
      margin-top: auto;
      border-top: 1px solid #ccc;
      z-index: 8000;
      position: relative;
    }

    /* 页面容器 */
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* 侧边栏样式 */
    .sidebar {
      position: fixed;
      left: 0;
      top: 100px;
      width: 25%;
      bottom: 0;
      background-color: #f9f9f9;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 7000;
    }

    /* 背景竖线 */
    .sidebar::after {
      content: "";
      position: absolute;
      right: 0;
      top: 1px;
      bottom: 0;
      width: 1px;
      background-color: #ccc;
      z-index: 1;
    }

    /* 侧边栏组 */
    .sidebar-group {
      position: relative;
      z-index: 2;
    }

    /* 侧边栏项 */
    .sidebar-item {
      padding: 18px 45px 18px 35px;
      font-size: 18px;
      color: #333;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background-color: #f0f0f0;
      border-right: 1px solid #ccc;
      transition: background-color 0.3s, padding-left 0.3s, transform 0.1s;
      z-index: 5;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .sidebar-item:hover {
      background-color: #eaeaea;
      padding-left: 40px;
    }

    .sidebar-item:active {
      background-color: #d0d0d0;
      transform: scale(0.98);
    }

    .sidebar-item.active, .sidebar-item.expanded {
      background-color: #e0e0e0;
      font-weight: bold;
      border-right-color: #e0e0e0;
    }

    /* 展开/收起箭头 */
    .sidebar-item.expandable::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 14px;
      transition: transform 0.3s ease;
    }

    .sidebar-item.expandable.expanded::after {
      transform: translateY(-50%) rotate(180deg);
    }

    /* 子项容器 */
    .sidebar-submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s cubic-bezier(0, 1, 0, 1);
      background-color: #d7d7d7;
      position: relative;
      z-index: 4;
    }

    .sidebar-submenu.expanded {
      max-height: 500px;
      transition: max-height 0.3s ease-in-out;
      border-right: 1px solid #d7d7d7;
    }

    /* 子项样式 */
    .sidebar-subitem {
      padding: 12px 50px;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      position: relative;
      border-right: 1px solid #d7d7d7;
      transition: background-color 0.3s, padding-left 0.3s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .sidebar-subitem:hover {
      background-color: rgba(0,0,0,0.05);
      padding-left: 55px;
    }

    .sidebar-subitem:active {
      transform: scale(0.98);
    }

    .sidebar-subitem.active {
      background-color: rgba(0,0,0,0.1);
      font-weight: bold;
      border-right-color: transparent;
    }

    /* 主内容区域样式 */
    .main-content {
      margin-left: 25%;
      margin-top: 90px;
      padding: 40px 60px;
      flex: 1;
      min-height: calc(100vh - 90px - 60px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      text-align: left;
      background: #ffffff;
    }

    /* 移动端内容带淡入淡出动画 */
    @media (max-width: 768px) {
      .main-content {
        opacity: 1;
        transition: opacity 0.5s ease;
      }

      .main-content.fade-out {
        opacity: 0;
      }
    }

    /* 内容区块样式 */
    .content-section h2 {
      color: #2c3e50;
      font-size: 28px;
      font-weight: 600;
      border-bottom: 3px solid #d7d7d7;
      padding-bottom: 15px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .content-section p {
      color: #34495e;
      margin-bottom: 1.5em;
      font-size: 16px;
      line-height: 1.8;
    }

    .info-box {
      background-color: #f5f8fa;
      border-left: 4px solid #d7d7d7;
      padding: 20px 25px;
      margin: 20px 0;
      border-radius: 4px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 25px 0;
    }

    .grid-item {
      background-color: #f9f9f9;
      padding: 25px;
      border-radius: 6px;
      border: 1px solid #e8e8e8;
    }

    /* ========== 移动端适配 (768px 及以下) ========== */
    @media (max-width: 768px) {
      /* 导航栏调整 */
      .navbar {
        height: 60px;
      }

      .navbar-logo {
        height: 50px;
        margin-right: 10px;
      }

      .logo-text {
        font-size: 24px;
      }

      /* 显示菜单按钮 */
      .menu-btn {
        display: block;
      }

      /* 加载页 Logo 缩小到 35px */
      .loading-logo {
        width: 35px;
        height: auto;
      }

      .loading-text {
        font-size: 14px;
        margin: 3px 0;
      }

      /* 侧边栏改为抽屉式菜单 */
      .sidebar {
        position: fixed;
        left: auto;
        right: 0;
        top: 60px;
        width: 70%;
        max-width: 280px;
        height: calc(100vh - 60px);
        background-color: #f9f9f9;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        overflow-y: auto;
        z-index: 6000;
        box-shadow: -2px 0 5px rgba(0,0,0,0.1);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .sidebar::after {
        display: none;
      }

      /* 侧边栏项调整 */
      .sidebar-item {
        padding: 15px 20px;
        font-size: 16px;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }

      .sidebar-item:hover {
        padding-left: 20px;
      }

      .sidebar-item.expandable::after {
        right: 15px;
      }

      .sidebar-subitem {
        padding: 12px 30px;
        font-size: 14px;
        border-right: none;
        border-bottom: 1px solid #e8e8e8;
      }

      .sidebar-subitem:hover {
        padding-left: 30px;
      }

      /* 主内容区域调整 */
      .main-content {
        margin-left: 0;
        margin-top: 70px;
        padding: 20px 15px;
        min-height: calc(100vh - 70px - 60px);
      }

      /* 内容区块调整 */
      .content-section h2 {
        font-size: 22px;
        padding-bottom: 10px;
        margin-bottom: 15px;
      }

      .content-section p {
        font-size: 14px;
        margin-bottom: 1em;
      }

      .info-box {
        padding: 15px 20px;
        margin: 15px 0;
      }

      .content-grid {
        grid-template-columns: 1fr;
        gap: 15px;
        margin: 15px 0;
      }

      .grid-item {
        padding: 20px;
      }

      .grid-item h3 {
        font-size: 16px;
        margin-top: 0;
      }

      /* 页脚调整 */
      footer {
        height: 50px;
      }
    }

    /* ========== 超小屏幕适配 (480px 及以下) ========== */
    @media (max-width: 480px) {
      .navbar {
        height: 55px;
      }

      .navbar-logo {
        height: 45px;
        margin-right: 8px;
      }

      .logo-text {
        font-size: 20px;
      }

      .menu-btn {
        font-size: 20px;
        padding: 8px;
      }

      .loading-logo {
        width: 35px;
      }

      .loading-text {
        font-size: 12px;
        margin: 2px 0;
      }

      .sidebar {
        top: 55px;
        height: calc(100vh - 55px);
      }

      .main-content {
        margin-top: 65px;
        padding: 15px 10px;
        min-height: calc(100vh - 65px - 50px);
      }

      .content-section h2 {
        font-size: 18px;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }

      .content-section p {
        font-size: 13px;
      }

      .sidebar-item {
        padding: 12px 15px;
        font-size: 14px;
      }

      .sidebar-subitem {
        padding: 10px 25px;
        font-size: 13px;
      }

      .grid-item {
        padding: 15px;
      }

      .grid-item h3 {
        font-size: 14px;
      }
    }

    /* 遮罩层 */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 5999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <div class="logo-container">
        <img src="/wkjasdka/index/echo logo.png" alt="echoLogo" class="navbar-logo" id="logo">
        <span class="logo-text">关于</span>
      </div>
      <button class="menu-btn" id="menuBtn">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </nav>

  <!-- 侧边栏遮罩 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 左侧选项栏 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-group">
      <div class="sidebar-item expandable" data-expandable="group-echo">
        Echo
      </div>
      <div class="sidebar-submenu" id="group-echo">
        <div class="sidebar-subitem" data-content="echo">Echo</div>
        <div class="sidebar-subitem" data-content="wkjasdka">W.K.Jasdka</div>
        <div class="sidebar-subitem" data-content="liuyanlin">Liuyanlin</div>
      </div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="contact">联系方式</div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="privacy">隐私政策</div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="terms">用户协议</div>
    </div>
  </div>

  <!-- 主内容区域 -->
  <div class="main-content" id="mainContent"></div>

  <!-- 加载层 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-content" id="loadingContent">
      <img src="index/logo3.png" alt="加载Logo" class="loading-logo" id="loadingLogo">
      <div class="loading-text-container">
        <div class="loading-text">from</div>
        <div class="loading-text">- Wkjasdka -</div>
      </div>
    </div>
  </div>

  <footer></footer>

  <script>
    const navbar = document.getElementById('navbar');
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuBtn');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    let lastScrollTop = 0;

    // 禁用/恢复页面滚动的函数
    function disableScroll() {
      document.body.style.overflow = 'hidden';
    }

    function enableScroll() {
      document.body.style.overflow = '';
    }

    // 检查是否有任何二级菜单处于展开状态
    function isAnySubmenuExpanded() {
      return document.querySelectorAll('.sidebar-submenu.expanded').length > 0;
    }
    
    // 菜单按钮点击事件
    menuBtn.addEventListener('click', function() {
      sidebar.classList.toggle('active');
      sidebarOverlay.classList.toggle('active');
    });

    // 遮罩点击关闭菜单
    sidebarOverlay.addEventListener('click', function() {
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
    });

    // 滚动隐藏导航栏
    window.addEventListener('scroll', function() {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      if (scrollTop > lastScrollTop && scrollTop > 50) {
        navbar.classList.add('hidden');
      } else {
        navbar.classList.remove('hidden');
      }
      lastScrollTop = scrollTop;
    });

    const contentData = {
      "echo": {
        body: `<div class="content-section"><h2>Echo 是什么？</h2><p>Echo 是一个致力于提升数字协作效率的创新项目。我们通过前沿的技术和人性化的设计，为用户提供无缝的协作体验。</p><div class="info-box"><p><strong>当前状态：</strong> 项目正在积极开发中，核心功能不断完善。</p></div></div>`
      },
      "wkjasdka": {
        body: `<div class="content-section"><h2>W.K.Jasdka 是什么？</h2><p>W.K.Jasdka 是 Echo 项目背后的核心团队标识，代表着对极致体验和创新精神的不懈追求。</p><div class="content-grid"><div class="grid-item"><h3>🎯 使命</h3><p>打造简洁、高效且人性化的软件工具</p></div><div class="grid-item"><h3>💡 理念</h3><p>以用户为中心，不断创新和改进</p></div></div></div>`
      },
      "liuyanlin": {
        body: `<div class="content-section"><h2>Liuyanlin 是什么？</h2><p>Liuyanlin 是 Echo 项目的重要组成部分和核心贡献者。</p></div>`
      },
      "contact": {
        body: `<div class="content-section"><h2>联系我们</h2><p>如果您有任何疑问，欢迎通过以下方式与我们联系：</p><div class="content-grid"><div class="grid-item"><h3>📧 电子邮件</h3><p><strong>wkjasdkayeah@yeah.net</strong></p></div></div></div>`
      },
      "privacy": {
        body: `<div class="content-section"><h2>隐私政策</h2><p>我们非常重视您的隐私。完整的隐私政策正在起草中。</p></div>`
      },
      "terms": {
        body: `<div class="content-section"><h2>用户协议</h2><p>欢迎使用 Echo 服务。本用户协议旨在明确双方的权利与义务。</p></div>`
      }
    };

    const mainContent = document.getElementById('mainContent');
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingContent = document.getElementById('loadingContent');
    const loadingLogo = document.getElementById('loadingLogo');

    // 移动端欢迎页模板
    const mobileWelcomeTemplate = `
      <div class="content-section">
        <h2 style="text-align: center; font-size: 28px; margin-bottom: 30px; color: #E67E22;">欢迎来到 Echo</h2>
        <div class="info-box" style="background-color: #f0f8ff; border-left-color: #E67E22; text-align: center;">
          <p style="font-size: 16px; line-height: 1.8; color: #333;">
            <strong>Hi 👋</strong><br><br>
            欢迎使用 Echo 关于页面。<br>
            点击右上角的菜单按钮，选择您感兴趣的内容吧！
          </p>
        </div>
        <div class="content-grid" style="margin-top: 40px;">
          <div class="grid-item" style="text-align: center;">
            <h3 style="font-size: 18px; color: #E67E22;">📖 了解 Echo</h3>
            <p>探索我们的项目理念和使命</p>
          </div>
          <div class="grid-item" style="text-align: center;">
            <h3 style="font-size: 18px; color: #E67E22;">👥 认识团队</h3>
            <p>与 W.K.Jasdka 和 Liuyanlin 相识</p>
          </div>
          <div class="grid-item" style="text-align: center;">
            <h3 style="font-size: 18px; color: #E67E22;">💬 联系我们</h3>
            <p>有任何问题？随时与我们取得联系</p>
          </div>
        </div>
      </div>
    `;

    // 加载页 Logo 加载逻辑
    function showLoadingContent() {
      loadingContent.classList.add('visible');
    }

    if (loadingLogo.complete) {
      showLoadingContent();
    } else {
      loadingLogo.addEventListener('load', showLoadingContent);
    }

    // 初始化页面显示逻辑
    function initializeContent() {
      // 检查是否是移动端
      const isMobile = window.innerWidth <= 768;
      if (isMobile) {
        // 移动端默认显示欢迎页
        mainContent.innerHTML = mobileWelcomeTemplate;
      }
      // 桌面端保持空白，不执行任何操作
    }

    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeContent);
    } else {
      initializeContent();
    }

    // 1. 可展开项点击
    document.querySelectorAll('.sidebar-item.expandable').forEach(item => {
      item.addEventListener('click', function() {
        const submenuId = this.dataset.expandable;
        const submenu = document.getElementById(submenuId);
        
        document.querySelectorAll('.sidebar-item.expandable.expanded').forEach(other => {
          if (other !== this) {
            other.classList.remove('expanded');
            document.getElementById(other.dataset.expandable).classList.remove('expanded');
          }
        });

        this.classList.toggle('expanded');
        submenu.classList.toggle('expanded');

        // 根据是否有任何展开的二级菜单来控制滚动
        if (isAnySubmenuExpanded()) {
          disableScroll();
        } else {
          enableScroll();
        }
      });
    });

    // 2. 子项点击
    document.querySelectorAll('.sidebar-subitem').forEach(item => {
      item.addEventListener('click', function() {
        const contentKey = this.dataset.content;
        const isActive = this.classList.contains('active');
        const isMobile = window.innerWidth <= 768;
        
        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));
        
        // 仅移动端添加淡出效果
        if (isMobile) {
          mainContent.classList.add('fade-out');
        }
        
        const updateContent = () => {
          if (isActive) {
            // 重复点击：移动端返回欢迎页，桌面端保持空白
            if (isMobile) {
              mainContent.innerHTML = mobileWelcomeTemplate;
            } else {
              mainContent.innerHTML = '';
            }
          } else {
            this.classList.add('active');
            this.closest('.sidebar-submenu').previousElementSibling.classList.add('active');
            if (contentData[contentKey]) mainContent.innerHTML = contentData[contentKey].body;
          }
          
          // 移动端移除淡出效果，触发淡入
          if (isMobile) {
            mainContent.classList.remove('fade-out');
          }
        };
        
        if (isMobile) {
          setTimeout(updateContent, 500);
        } else {
          updateContent();
        }
        
        // 移动端关闭菜单
        if (isMobile) {
          sidebar.classList.remove('active');
          sidebarOverlay.classList.remove('active');
        }
      });
    });

    // 3. 普通项点击
    document.querySelectorAll('.sidebar-item:not(.expandable)').forEach(item => {
      item.addEventListener('click', function() {
        const contentKey = this.dataset.content;
        const isActive = this.classList.contains('active');
        const isMobile = window.innerWidth <= 768;
        
        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));
        
        // 仅移动端添加淡出效果
        if (isMobile) {
          mainContent.classList.add('fade-out');
        }
        
        const updateContent = () => {
          if (isActive) {
            // 重复点击：移动端返回欢迎页，桌面端保持空白
            if (isMobile) {
              mainContent.innerHTML = mobileWelcomeTemplate;
            } else {
              mainContent.innerHTML = '';
            }
          } else {
            this.classList.add('active');
            if (contentData[contentKey]) mainContent.innerHTML = contentData[contentKey].body;
            
            document.querySelectorAll('.sidebar-item.expandable.expanded').forEach(expandable => {
              expandable.classList.remove('expanded');
              document.getElementById(expandable.dataset.expandable).classList.remove('expanded');
            });
          }
          
          // 移动端移除淡出效果，触发淡入
          if (isMobile) {
            mainContent.classList.remove('fade-out');
          }
        };
        
        if (isMobile) {
          setTimeout(updateContent, 500);
        } else {
          updateContent();
        }
        
        // 移动端关闭菜单
        if (isMobile) {
          sidebar.classList.remove('active');
          sidebarOverlay.classList.remove('active');
        }
      });
    });

    // 确保资源完全加载后关闭加载页
    window.addEventListener('load', function() {
      loadingScreen.classList.add('hidden');
    });
  </script>
</body>
</html>
