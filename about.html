  <script>
    (function () {
      const themeKey = 'wkjasdka-dark-mode';
      const root = document.documentElement;
      const systemTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      const savedTheme = () => {
        try {
          const value = localStorage.getItem(themeKey);
          if (value === 'dark' || value === 'true') return 'dark';
          if (value === 'light' || value === 'false') return 'light';
          return 'system';
        } catch (_) {
          return 'system';
        }
      };
      const applyTheme = () => {
        const preference = savedTheme();
        const dark = preference === 'dark' || (preference === 'system' && Boolean(systemTheme && systemTheme.matches));
        root.classList.toggle('dark-mode', dark);
        root.classList.toggle('light-mode', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      applyTheme();
      window.addEventListener('storage', event => {
        if (event.key === themeKey || event.key === null) applyTheme();
      });
      if (systemTheme) {
        const onSystemThemeChange = () => {
          if (savedTheme() === 'system') applyTheme();
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', onSystemThemeChange);
        else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>

    /* 全局样式 */

    .menu-btn:not(.rotated) { transition: transform 0.35s ease-out; }

      cancelSidebarDrag();
      const overlay = document.createElement('div');
      overlay.className = 'article-wait-overlay';
      overlay.setAttribute('role', 'status');
      overlay.setAttribute('aria-live', 'polite');
      overlay.tabIndex = -1;
      const status = document.createElement('span');
      status.className = 'article-wait-status';
      status.dataset.i18n = 'articleLoading';
      status.textContent = 'Loading article…';
      overlay.appendChild(status);

      const focus = operation.focusBeforeSuspend || document.activeElement;
      operation.focusBeforeSuspend = null;
      const inertElements = [...document.body.children].map(element => [element, element.getAttribute('inert')]);
      const previousBusy = mainContent.getAttribute('aria-busy');
      inertElements.forEach(([element]) => element.setAttribute('inert', ''));
      mainContent.setAttribute('aria-busy', 'true');
      document.body.appendChild(overlay);
      const motion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      const ui = { overlay, focus, inertElements, previousBusy, animation: null, fadeTimer: null, fadeHandler: null, motion, motionHandler: null };
      articleWaitUi = ui;
      overlay.focus({ preventScroll: true });
      function showIndicator() {
        if (fadingArticleWaits.has(ui)) {
          if (motion && motion.matches) disposeArticleWait(ui);
          return;
        }
        if (articleWaitUi !== ui) return;
        if (ui.animation) ui.animation.stop();
        ui.animation = null;
        const previous = overlay.querySelector('.article-wait-static');
        if (previous) previous.remove();
        try {
          if (!(motion && motion.matches) && window.SiteLoadingAnimation) {
            ui.animation = window.SiteLoadingAnimation.start(overlay, { loop: true });
            return;
          }
        } catch (error) {
          console.warn('[about] Could not start the article loading animation.', error);
        }
        const indicator = document.createElement('div');
        indicator.className = 'article-wait-static';
        indicator.setAttribute('aria-hidden', 'true');
        overlay.appendChild(indicator);
      }
      ui.motionHandler = showIndicator;
      if (motion && motion.addEventListener) motion.addEventListener('change', ui.motionHandler);
      else if (motion && motion.addListener) motion.addListener(ui.motionHandler);
      showIndicator();
      requestAnimationFrame(() => {
        if (articleWaitUi !== ui && !fadingArticleWaits.has(ui)) return;
        try { SiteI18n.apply(status, { namespace: 'about' }); } catch (_) {}
        overlay.classList.add('is-visible');
      });
    }

    function restoreArticleFocus(target) {
      if (!target || !target.isConnected || target === document.body || target === document.documentElement ||
          target.disabled || target.closest('[inert]') || !target.getClientRects().length) {
        target = window.innerWidth <= 768 ? menuBtn : document.getElementById('aboutTitleButton');
      }
      if (target && typeof target.focus === 'function') target.focus({ preventScroll: true });
    }

    function hideArticleWait(immediate = false, restoreFocus = true) {
      const ui = articleWaitUi;
      if (!ui) return;
      articleWaitUi = null;
      ui.inertElements.forEach(([element, previous]) => {
        if (previous === null) element.removeAttribute('inert');
        else element.setAttribute('inert', previous);
      });
      if (ui.previousBusy === null) mainContent.removeAttribute('aria-busy');
      else mainContent.setAttribute('aria-busy', ui.previousBusy);
      ui.overlay.style.pointerEvents = 'none';
      if (restoreFocus) restoreArticleFocus(ui.focus);
      ui.overlay.setAttribute('aria-hidden', 'true');
      if (immediate) disposeArticleWait(ui);
      else {
        fadingArticleWaits.add(ui);
        if (ui.motion && ui.motion.matches) {
          disposeArticleWait(ui);
          return;
        }
        scheduleArticleWaitDisposal(ui);
        ui.overlay.classList.add('is-finishing');
        if (ui.animation && typeof ui.animation.finish === 'function') ui.animation.finish();
        requestAnimationFrame(() => {
          if (fadingArticleWaits.has(ui) && parseFloat(getComputedStyle(ui.overlay).opacity) === 0) disposeArticleWait(ui);
        });
      }
    }

    function scheduleArticleWait(operation) {
      const delay = Math.max(0, ARTICLE_WAIT_DELAY_MS - (performance.now() - operation.startedAt));
      operation.timer = window.setTimeout(() => {
        operation.timer = null;
        showArticleWait(operation);
      }, delay);
    }

    function beginArticleLoading(transitionId) {
      if (articleLoading && articleLoading.transitionId === transitionId) return articleLoading;
      finishArticleLoading(articleLoading, true);
      const operation = { transitionId, startedAt: performance.now(), timer: null, suspended: false };
      articleLoading = operation;
      scheduleArticleWait(operation);
      return operation;
    }

    function finishArticleLoading(operation, cancelled = false, immediate = false, restoreFocus = true) {
      if (!operation || operation !== articleLoading) return;
      // Compensate for a throttled timer if the request has already passed the
      // deadline, but never show a cancelled or superseded operation.
      if (!cancelled && !operation.suspended && !articleWaitUi &&
          performance.now() - operation.startedAt >= ARTICLE_WAIT_DELAY_MS) {
        try { showArticleWait(operation); }
        catch (error) { console.warn('[about] Could not display the article loading indicator.', error); }
      }
      if (!cancelled && operation.suspended && restoreFocus && operation.focusBeforeSuspend) {
        deferredArticleFocus = operation.focusBeforeSuspend;
      }
      if (operation.timer !== null) window.clearTimeout(operation.timer);
      articleLoading = null;
      hideArticleWait(immediate, restoreFocus);
    }

    window.addEventListener('pagehide', event => {
      fadingArticleWaits.forEach(ui => disposeArticleWait(ui));
      fadingArticleWaits.clear();
      if (!articleLoading) return;
      if (!event.persisted) {
        finishArticleLoading(articleLoading, true, true, false);
        return;
      }
      if (articleLoading.timer !== null) window.clearTimeout(articleLoading.timer);
      articleLoading.timer = null;
      if (articleWaitUi) articleLoading.focusBeforeSuspend = articleWaitUi.focus;
      articleLoading.suspended = true;
      hideArticleWait(true, false);
    });
    window.addEventListener('pageshow', event => {
      if (!event.persisted) return;
      if (articleLoading && articleLoading.suspended) {
        articleLoading.suspended = false;
        scheduleArticleWait(articleLoading);
      } else if (deferredArticleFocus) {
        restoreArticleFocus(deferredArticleFocus);
        deferredArticleFocus = null;
      }
    });

    function beginContentTransition() {
      finishArticleLoading(articleLoading, true, true);
      titleResetInProgress = false;
      titleResetTransitionId = null;
      document.getElementById('aboutTitleButton').classList.remove('is-resetting');
      if (releaseInitialContentWait) {
        releaseInitialContentWait();
        releaseInitialContentWait = null;
      }
      articleRequestId += 1;
      contentTransitionId += 1;
      return contentTransitionId;
    }

    function loadArticle(key) {
      if (!articleKeys.has(key)) return Promise.reject(new Error(`Unknown article: ${key}`));
      if (!articleCache.has(key)) {
        const url = new URL(`./resource/article/${key}.json`, document.baseURI);
        url.searchParams.set('v', '20261117-multilingual');
        if (articleReloadToken) url.searchParams.set('_wkjasdka_full_reload', articleReloadToken);
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 10000);
        const request = fetch(url, {
          credentials: 'same-origin',
          cache: articleReloadToken ? 'reload' : 'default',
          signal: controller.signal
        }).then(response => {
          if (!response.ok) throw new Error(`Could not load article ${key} (${response.status})`);
          return response.json();
        }).then(article => {
          if (!article || !Array.isArray(article.html) || !article.html.length || !article.html.every(line => typeof line === 'string') || !article.translations || typeof article.translations !== 'object' || !article.translations.en || !article.translations.en.article || typeof article.translations.en.article !== 'object') {
            throw new Error(`Invalid article format: ${key}`);
          }
          return article;
        }).catch(error => {
          articleCache.delete(key);
          throw error;
        }).finally(() => window.clearTimeout(timeout));
        articleCache.set(key, request);
      }
      return articleCache.get(key);
    }

    function translateCurrentArticle() {
      if (currentArticle) SiteI18n.apply(mainContent, { namespace: '', dictionaries: currentArticle.translations });
    }

    async function setMainContent(key, transitionId = contentTransitionId) {
      if (transitionId !== contentTransitionId) return false;
      const operation = beginArticleLoading(transitionId);
      const requestId = ++articleRequestId;
      try {
        const article = await loadArticle(key);
        if (requestId !== articleRequestId || transitionId !== contentTransitionId) return false;
        currentArticle = article;
        currentArticleKey = key;
        mainContent.dataset.article = key;
        mainContent.innerHTML = article.html.join('\n');
        translateCurrentArticle();
      } catch (error) {
        if (requestId !== articleRequestId || transitionId !== contentTransitionId) return false;
        console.error('[about] Could not load article.', error);
        currentArticle = null;
        currentArticleKey = null;
        delete mainContent.dataset.article;
        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(item => item.classList.remove('active'));
        mainContent.innerHTML = '<div class="content-section"><p data-i18n="articleLoadError">Could not load this article. Please try again.</p></div>';
        SiteI18n.apply(mainContent, { namespace: 'about' });
      } finally {
        finishArticleLoading(operation);
      }
      return true;
    }

    function clearMainContent() {
      articleRequestId += 1;
      currentArticle = null;
      currentArticleKey = null;
      delete mainContent.dataset.article;
      mainContent.innerHTML = '';
    }

    window.addEventListener('site:languagechange', () => {
      translateCurrentArticle();
      if (articleWaitUi) SiteI18n.apply(articleWaitUi.overlay.querySelector('.article-wait-status'), { namespace: 'about' });
    });

    const aboutTitleButton = document.getElementById('aboutTitleButton');

    function resetAboutView() {
      const isMobile = window.innerWidth <= 768;

      if (!isMobile) {
        beginContentTransition();
        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(item => item.classList.remove('active'));
        mainContent.classList.remove('fade-out');
        clearMainContent();
        window.scrollTo(0, 0);
        return;
      }

      if (titleResetInProgress) return;
      const transitionId = beginContentTransition();
      const isAlreadyOnWelcome = currentArticleKey === 'welcome';

      titleResetInProgress = true;
      titleResetTransitionId = transitionId;
      if (!isAlreadyOnWelcome) beginArticleLoading(transitionId);
      keepNavbarVisible(650);
      if (sidebar.classList.contains('active')) closeSidebar();
      if (!isAlreadyOnWelcome) {
        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(item => item.classList.remove('active'));
        mainContent.classList.add('fade-out');
      } else {
        mainContent.classList.remove('fade-out');
      }

      aboutTitleButton.classList.remove('is-resetting');
      void aboutTitleButton.offsetWidth;
      aboutTitleButton.classList.add('is-resetting');

      let titleAnimationFinished = false;
      let titleAnimationFallback;
      const finishTitleAnimation = () => {
        if (titleAnimationFinished) return;
        titleAnimationFinished = true;
        clearTimeout(titleAnimationFallback);
        if (transitionId !== contentTransitionId) return;
        aboutTitleButton.classList.remove('is-resetting');
        if (isAlreadyOnWelcome && titleResetTransitionId === transitionId) {
          titleResetInProgress = false;
          titleResetTransitionId = null;
        }
      };
      aboutTitleButton.addEventListener('animationend', finishTitleAnimation, { once: true });
      titleAnimationFallback = window.setTimeout(finishTitleAnimation, 360);

      if (isAlreadyOnWelcome) return;

      window.setTimeout(async () => {
        if (transitionId !== contentTransitionId) return;
        try {
          await setMainContent('welcome', transitionId);
          if (transitionId === contentTransitionId) {
            window.scrollTo(0, 0);
            mainContent.classList.remove('fade-out');
          }
        } finally {
          if (titleResetTransitionId === transitionId) {
            titleResetInProgress = false;
            titleResetTransitionId = null;
          }
        }
      }, 500);
    }

    aboutTitleButton.addEventListener('click', resetAboutView);
    aboutTitleButton.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        resetAboutView();
      }
    });

    // 加载页 Logo 加载逻辑
    function showLoadingContent() {
      loadingScreen.classList.add('loading-ready');
      loadingContent.classList.add('visible');
    }

    function waitForLoadingImage(image) {
      return new Promise(resolve => {
        if (!image) {
          resolve(false);
          return;
        }
        const finish = async () => {
          if (image.naturalWidth <= 0) {
            resolve(false);
            return;
          }
          try {
            if (typeof image.decode === 'function') await image.decode();
            requestAnimationFrame(() => resolve(image.naturalWidth > 0));
          } catch (_) {
            resolve(false);
          }
        };
        if (image.complete) {
          finish();
          return;
        }
        image.addEventListener('load', finish, { once: true });
        image.addEventListener('error', () => resolve(false), { once: true });
      });
    }

    const loadingImagesReady = Promise.all([
      waitForLoadingImage(activeLoadingLogo),
      waitForLoadingImage(loadingScreen.querySelector('.loading-footer-image'))
    ]).then(([centerReady, footerReady]) => {
      if (centerReady && footerReady) showLoadingContent();
    });

    // 初始化页面显示逻辑
    function initializeContent() {
      // 检查是否是移动端
      const isMobile = window.innerWidth <= 768;
      if (isMobile) {
        // 移动端默认显示欢迎页
        const initialArticle = setMainContent('welcome', beginContentTransition());
        const cancelledInitial = new Promise(resolve => { releaseInitialContentWait = resolve; });
        initialContentReady = Promise.race([initialArticle, cancelledInitial]);
        initialContentReady.then(() => { releaseInitialContentWait = null; });
      }
      // 桌面端保持空白，不执行任何操作
    }

    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeContent);
    } else {
      initializeContent();
    }

    // 1. 可展开项点击
    document.querySelectorAll('.sidebar-item.expandable').forEach(item => {
      item.addEventListener('click', function() {
        const submenuId = this.dataset.expandable;
        const submenu = document.getElementById(submenuId);

        this.classList.toggle('expanded');
        submenu.classList.toggle('expanded');

        syncPageScrollLock();
      });
    });

    // 2. 子项和普通选项使用同一套文章切换逻辑。
    function selectArticle(item, isSubitem) {
      const contentKey = item.dataset.content;
      const isActive = item.classList.contains('active');
      const isMobile = window.innerWidth <= 768;
      const transitionId = beginContentTransition();
      if ((isActive && isMobile) || (!isActive && articleKeys.has(contentKey))) beginArticleLoading(transitionId);

      document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));
      if (isMobile) mainContent.classList.add('fade-out');

      const updateContent = async () => {
        if (transitionId !== contentTransitionId) return;
        if (isActive) {
          // 重复点击：移动端返回欢迎页，桌面端保持空白。
          if (isMobile) await setMainContent('welcome', transitionId);
          else clearMainContent();
        } else {
          item.classList.add('active');
          if (isSubitem) item.closest('.sidebar-submenu').previousElementSibling.classList.add('active');
          if (articleKeys.has(contentKey)) await setMainContent(contentKey, transitionId);
        }
        if (isMobile && transitionId === contentTransitionId) mainContent.classList.remove('fade-out');
      };

      if (isMobile) {
        setTimeout(updateContent, 500);
        closeSidebar();
      } else {
        updateContent();
      }
    }

    document.querySelectorAll('.sidebar-subitem').forEach(item => {
      item.addEventListener('click', () => selectArticle(item, true));
    });
    document.querySelectorAll('.sidebar-item:not(.expandable)').forEach(item => {
      item.addEventListener('click', () => selectArticle(item, false));
    });

    // 确保资源完全加载后关闭加载页
    window.addEventListener('load', function() {
      Promise.all([loadingImagesReady, initialContentReady]).then(() => loadingScreen.classList.add('hidden'));
    });
  </script>
</body>
