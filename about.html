<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>关于 - Echo</title>
  <link rel="icon" href="/wkjasdka/index/echo logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 全局样式 */
    ::selection {
      background: #E67E22;
      color: white;
    }
    ::-moz-selection {
      background: #E67E22;
      color: white;
    }

    /* 导航栏样式 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #d7d7d7;
      padding: 0;
      height: 73.5px;
      z-index: 9000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.4s ease-out;
    }
    
    .navbar.hidden {
      transform: translateY(-100%);
    }
    
    .navbar-container {
      width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .navbar-logo {
      height: 65px;
      width: auto;
      margin-right: 15px;
      cursor: pointer;
    }
    
    .navbar-logo:hover {
      transform: scale(1.05);
    }

    .logo-text {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    /* 加载层样式 */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-screen.hidden {
      display: none;
    }

    .loading-logo {
      width: 165px; 
      height: auto;
    }

    .loading-text-container {
      position: absolute;
      bottom: 32px; /* 调整为距离底部 32px */
      left: 0;
      width: 100%;
      text-align: center;
      padding: 0;
    }

    .loading-text {
      color: #6a6a6a;
      font-size: 16px;
      margin: 5px 0;
    }

    /* 页脚样式 */
    footer {
      height: 60px;
      background-color: #f5f5f5;
      margin-top: auto;
      border-top: 1px solid #ccc;
      z-index: 8000;
      position: relative;
    }

    /* 页面容器 */
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* 侧边栏样式 */
    .sidebar {
      position: fixed;
      left: 0;
      top: 100px;
      width: 25%;
      bottom: 0;
      background-color: #f9f9f9;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 7000;
    }

    /* 背景竖线 - 抹除顶部像素，起始位置微调 */
    .sidebar::after {
      content: "";
      position: absolute;
      right: 0;
      top: 1px; /* 抹除最顶部的 1px，避免超出第一个选项卡 */
      bottom: 0;
      width: 1px;
      background-color: #ccc;
      z-index: 1;
    }

    /* 侧边栏组 */
    .sidebar-group {
      position: relative;
      z-index: 2;
    }

    /* 侧边栏项 */
    .sidebar-item {
      padding: 18px 45px 18px 35px;
      font-size: 18px;
      color: #333;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background-color: #f0f0f0;
      
      /* 默认无圆角 */
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      
      border-right: 1px solid #ccc;
      transition: background-color 0.3s, padding-left 0.3s, transform 0.1s;
      z-index: 5;
    }

    /* 取消最顶部选项在被选中/展开时的圆角 */
    .sidebar-group:first-child .sidebar-item.active,
    .sidebar-group:first-child .sidebar-item.expanded {
      border-top-right-radius: 0;
    }

    .sidebar-item:hover {
      background-color: #eaeaea;
      padding-left: 40px;
    }

    .sidebar-item.active, .sidebar-item.expanded {
      background-color: #e0e0e0;
      font-weight: bold;
      border-right-color: #e0e0e0; /* 激活时与背景色融合 */
    }
    
    .sidebar-item:active {
      transform: scale(0.98);
      background-color: #d0d0d0;
    }

    /* 展开/收起箭头 */
    .sidebar-item.expandable::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 14px;
      transition: transform 0.3s ease;
    }

    .sidebar-item.expandable.expanded::after {
      transform: translateY(-50%) rotate(180deg);
    }

    /* 子项容器 */
    .sidebar-submenu {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s cubic-bezier(0, 1, 0, 1);
      background-color: #d7d7d7;
      position: relative;
      z-index: 4;
    }

    .sidebar-submenu.expanded {
      max-height: 500px;
      transition: max-height 0.3s ease-in-out;
      border-right: 1px solid #d7d7d7;
    }

    /* 子项样式 - 始终无圆角 */
    .sidebar-subitem {
      padding: 12px 50px;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      position: relative;
      border-right: 1px solid #d7d7d7;
      transition: background-color 0.3s, padding-left 0.3s, transform 0.1s;
    }

    .sidebar-subitem + .sidebar-subitem {
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    .sidebar-subitem:hover {
      background-color: rgba(0,0,0,0.05);
      padding-left: 55px;
    }

    .sidebar-subitem.active {
      background-color: rgba(0,0,0,0.1);
      font-weight: bold;
      border-right-color: transparent;
    }

    .sidebar-subitem:active {
      transform: scale(0.98);
    }

    /* 主内容区域样式 */
    .main-content {
      margin-left: 25%;
      margin-top: 90px;
      padding: 40px 60px;
      flex: 1;
      min-height: calc(100vh - 90px - 60px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      text-align: left;
      background: #ffffff;
    }

    /* 内容区块样式 */
    .content-section h2 {
      color: #2c3e50;
      font-size: 28px;
      font-weight: 600;
      border-bottom: 3px solid #d7d7d7;
      padding-bottom: 15px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .content-section p {
      color: #34495e;
      margin-bottom: 1.5em;
      font-size: 16px;
      line-height: 1.8;
    }

    .info-box {
      background-color: #f5f8fa;
      border-left: 4px solid #d7d7d7;
      padding: 20px 25px;
      margin: 20px 0;
      border-radius: 4px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 25px 0;
    }

    .grid-item {
      background-color: #f9f9f9;
      padding: 25px;
      border-radius: 6px;
      border: 1px solid #e8e8e8;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <div class="logo-container">
        <img src="/wkjasdka/index/echo logo.png" alt="echoLogo" class="navbar-logo" id="logo">
        <span class="logo-text">关于</span>
      </div>
    </div>
  </nav>

  <!-- 左侧选项栏 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-group">
      <div class="sidebar-item expandable" data-expandable="group-echo">
        Echo
      </div>
      <div class="sidebar-submenu" id="group-echo">
        <div class="sidebar-subitem" data-content="echo">Echo</div>
        <div class="sidebar-subitem" data-content="wkjasdka">W.K.Jasdka</div>
        <div class="sidebar-subitem" data-content="liuyanlin">Liuyanlin</div>
      </div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="contact">联系方式</div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="privacy">隐私政策</div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-item" data-content="terms">用户协议</div>
    </div>
  </div>

  <!-- 主内容区域 -->
  <div class="main-content" id="mainContent"></div>

  <!-- 加载层 -->
  <div class="loading-screen" id="loadingScreen">
    <img src="index/logo3.png" alt="加载Logo" class="loading-logo">
    <div class="loading-text-container">
      <div class="loading-text">from</div>
      <div class="loading-text">- Wkjasdka -</div>
    </div>
  </div>

  <footer></footer>

  <script>
    const navbar = document.getElementById('navbar');
    let lastScrollTop = 0;
    window.addEventListener('scroll', function() {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      if (scrollTop > lastScrollTop && scrollTop > 50) {
        navbar.classList.add('hidden');
      } else {
        navbar.classList.remove('hidden');
      }
      lastScrollTop = scrollTop;
    });

    const contentData = {
      "echo": {
        body: `<div class="content-section"><h2>Echo 是什么？</h2><p>Echo 是一个致力于提升数字协作效率的创新项目。我们通过前沿的技术 and 人性化的设计，为用户提供无缝的协作体验。</p><div class="info-box"><p><strong>当前状态：</strong> 项目正在积极开发中，核心功能不断完善。</p></div></div>`
      },
      "wkjasdka": {
        body: `<div class="content-section"><h2>W.K.Jasdka 是什么？</h2><p>W.K.Jasdka 是 Echo 项目背后的核心团队标识，代表着对极致体验和创新精神的不懈追求。</p><div class="content-grid"><div class="grid-item"><h3>🎯 使命</h3><p>打造简洁、高效且人性化的软件工具</p></div><div class="grid-item"><h3>💡 理念</h3><p>以用户为中心，不断创新和改进</p></div></div></div>`
      },
      "liuyanlin": {
        body: `<div class="content-section"><h2>Liuyanlin 是什么？</h2><p>Liuyanlin 是 Echo 项目的重要组成部分和核心贡献者。</p></div>`
      },
      "contact": {
        body: `<div class="content-section"><h2>联系我们</h2><p>如果您有任何疑问，欢迎通过以下方式与我们联系：</p><div class="content-grid"><div class="grid-item"><h3>📧 电子邮件</h3><p><strong>wkjasdkayeah@yeah.net</strong></p></div></div></div>`
      },
      "privacy": {
        body: `<div class="content-section"><h2>隐私政策</h2><p>我们非常重视您的隐私。完整的隐私政策正在起草中。</p></div>`
      },
      "terms": {
        body: `<div class="content-section"><h2>用户协议</h2><p>欢迎使用 Echo 服务。本用户协议旨在明确双方的权利与义务。</p></div>`
      }
    };

    const mainContent = document.getElementById('mainContent');
    const loadingScreen = document.getElementById('loadingScreen');

    // 1. 可展开项点击
    document.querySelectorAll('.sidebar-item.expandable').forEach(item => {
      item.addEventListener('click', function() {
        const submenuId = this.dataset.expandable;
        const submenu = document.getElementById(submenuId);
        
        document.querySelectorAll('.sidebar-item.expandable.expanded').forEach(other => {
          if (other !== this) {
            other.classList.remove('expanded');
            document.getElementById(other.dataset.expandable).classList.remove('expanded');
          }
        });

        this.classList.toggle('expanded');
        submenu.classList.toggle('expanded');
      });
    });

    // 2. 子项点击
    document.querySelectorAll('.sidebar-subitem').forEach(item => {
      item.addEventListener('click', function() {
        const contentKey = this.dataset.content;
        const isActive = this.classList.contains('active');
        
        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));
        
        if (isActive) {
          mainContent.innerHTML = '';
        } else {
          this.classList.add('active');
          this.closest('.sidebar-submenu').previousElementSibling.classList.add('active');
          if (contentData[contentKey]) mainContent.innerHTML = contentData[contentKey].body;
        }
      });
    });

    // 3. 普通项点击
    document.querySelectorAll('.sidebar-item:not(.expandable)').forEach(item => {
      item.addEventListener('click', function() {
        const contentKey = this.dataset.content;
        const isActive = this.classList.contains('active');
        
        document.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));
        
        if (isActive) {
          mainContent.innerHTML = '';
        } else {
          this.classList.add('active');
          if (contentData[contentKey]) mainContent.innerHTML = contentData[contentKey].body;
          
          document.querySelectorAll('.sidebar-item.expandable.expanded').forEach(expandable => {
            expandable.classList.remove('expanded');
            document.getElementById(expandable.dataset.expandable).classList.remove('expanded');
          });
        }
      });
    });

    // 确保资源完全加载后关闭加载页
    window.addEventListener('load', function() {
      loadingScreen.classList.add('hidden');
    });
  </script>
</body>
</html>
