<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKJASDKA LOADING ANIMATION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; padding-top: 50px; }
        .animation-control {
            min-width: 110px;
            margin-top: 20px;
            padding: 10px 24px;
            border: 2px solid #FFB380;
            border-radius: 999px;
            background: #FFDAB9;
            color: #7B3D00;
            font: 600 16px/1.25 system-ui, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform .2s ease, background-color .2s ease, border-color .2s ease;
        }
        @media (hover: hover) and (pointer: fine) {
            .animation-control:hover { background: #FFE4C4; border-color: #FF9966; }
        }
        .animation-control:active { transform: translateY(2px) scale(.98); background: #FFC38D; border-color: #FF9C5A; }
        .animation-control:focus-visible { outline: 3px solid #7B3D00; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { .animation-control { transition: none; } }
    </style>
</head>
<body>
    <div class="animation-container" aria-hidden="true"></div>

    <h1>Loading Animation</h1>
    <p>-from-<br>Wkjasdka</p>
    <button class="animation-control" id="animationControl" type="button">Start</button>

    <!-- Shared animation styles and timing: ../scripts/loading-animation.js -->
    <script src="../scripts/loading-animation.js?v=20261117-mobile-speed"></script>
    <script>
        const animationContainer = document.querySelector('.animation-container');
        const animationControl = document.getElementById('animationControl');
        let loadingAnimation = null;

        function resetAnimation() {
            if (loadingAnimation) {
                loadingAnimation.stop();
                loadingAnimation = null;
            }
            animationControl.textContent = 'Start';
        }

        animationControl.addEventListener('click', () => {
            if (loadingAnimation) {
                resetAnimation();
                return;
            }
            loadingAnimation = window.SiteLoadingAnimation.start(document.body, {
                container: animationContainer,
                loop: true
            });
            animationControl.textContent = 'Reset';
        });
        window.addEventListener('pagehide', resetAnimation);
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) resetAnimation();
        });
    </script>
</body>
</html>
