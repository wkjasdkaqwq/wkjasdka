<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKJASDKA CUSTOMIZATION LOADING SCREEN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; padding-top: 50px; }
    </style>
</head>
<body>
    <div class="animation-container">
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="progress-container-new">
            <div class="progress-bar-new"></div>
        </div>
        <div class="ball"></div>
        <div class="ball-slow"></div>
    </div>
    
    <h1>Loading Animation</h1>
    <a>-from-<br>Wkjasdka<br>Press "F5" to replay</a>

    <!-- Shared animation styles and timing: ../scripts/loading-animation.js -->
    <script src="../scripts/loading-animation.js?v=20261117-mobile-speed"></script>
    <script>
        const loadingAnimation = window.SiteLoadingAnimation.start(document.body, {
            container: document.querySelector('.animation-container'),
            loop: true
        });
        window.addEventListener('beforeunload', () => loadingAnimation.stop(), { once: true });
    </script>
</body>
</html>
