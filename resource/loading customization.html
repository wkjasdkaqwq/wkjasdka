<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKJASDKA CUSTOMIZATION LOADING SCREEN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            padding-top: 50px;
        }
        
        .animation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            overflow: hidden;
        }
        
        .progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            overflow: hidden;
        }
        
        .progress-bar {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: #ff8000;
            border-radius: 4px;
            animation: none;
        }
        
        .progress-bar.active {
            animation: 
                slideProgress 0.5s linear forwards,
                stayProgress 0.8s linear 0.8s forwards,
                shrinkProgress 0.6s linear 0.7s forwards;
            animation-fill-mode: forwards;
        }
        
        .progress-container-new {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            overflow: hidden;
        }
        
        .progress-bar-new {
            position: absolute;
            top: 0;
            left: calc(-600px - 20px);
            width: 600px;
            height: 100%;
            background-color: #ff8000;
            border-radius: 4px;
            animation: none;
        }
        
        .ball {
            position: absolute;
            top: 0;
            left: -20px;
            width: 8px;
            height: 8px;
            background-color: #ff8000;
            border-radius: 50%;
            animation: slideBall 0.9s linear forwards;
        }
        
        .ball-slow {
            position: absolute;
            top: 0;
            left: -20px;
            width: 8px;
            height: 8px;
            background-color: #ff8000;
            border-radius: 50%;
            opacity: 0;
        }
        
        .ball-slow.active {
            opacity: 1;
        }
        
        @keyframes slideBall {
            0% { left: -20px; }
            100% { left: calc(100% + 8px); }
        }
        
        @keyframes slideProgress {
            0% { left: -100%; }
            100% { left: 0; }
        }
        
        @keyframes stayProgress {
            0%, 100% { left: 0; width: 100%; }
        }
        
        @keyframes shrinkProgress {
            0% { width: 100%; left: 0; }
            100% { width: 0; left: 100%; }
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="progress-container-new">
            <div class="progress-bar-new"></div>
        </div>
        <div class="ball"></div>
        <div class="ball-slow"></div>
    </div>
    
    <h1>Loading Animation</h1>
    <a>-from-<br>Wkjasdka<br>Press "F5" to replay</a>

    <script>
        const ballSlow = document.querySelector('.ball-slow');
        const progressBar = document.querySelector('.progress-bar');
        const progressNew = document.querySelector('.progress-bar-new');
        const mobileLayout = window.matchMedia('(max-width: 768px), (max-width: 1024px) and (pointer: coarse)');
        let progressTriggered = false;
        let slowBallTriggered = false;
        let newProgressTriggered = false;
        let slowBallStartPos = -20;
        let animationFrameId = null;
        let barAnimationFrameId = null;

        // Scale the desktop proportions and pixel speed together on smaller
        // touch screens, preserving the same pacing and gap behind the ball.
        function getAnimationGeometry() {
            const containerWidth = Math.max(document.documentElement.clientWidth, 1);
            const scale = mobileLayout.matches ? containerWidth / 1440 : 1;
            const baseSpeed = 2.5 * scale;
            const fixedDistance = 170 * scale;
            const ballStart = mobileLayout.matches ? -Math.max(8, 30 * scale) : -30;
            const ballEnd = containerWidth + 8;
            const ballDistance = ballEnd - ballStart;
            const barWidth = 600 * scale;
            const barStart = ballStart - fixedDistance - barWidth;
            const barEnd = containerWidth + barWidth;
            const barDistance = barEnd - barStart;
            return {
                containerWidth, triggerDistance: 430 * scale,
                ballStart, ballDistance, ballDuration: ballDistance / baseSpeed,
                barWidth, barStart, barDistance, barDuration: barDistance / baseSpeed
            };
        }

        let geometry = getAnimationGeometry();
        function updateAnimationGeometry() {
            geometry = getAnimationGeometry();
            progressNew.style.width = `${geometry.barWidth}px`;
        }
        updateAnimationGeometry();
        window.addEventListener('resize', updateAnimationGeometry);
        
        function startBallAnimation() {
            const startTime = performance.now();
            ballSlow.style.left = `${geometry.ballStart}px`;
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / geometry.ballDuration, 1);
                const currentPos = geometry.ballStart + (geometry.ballDistance * progress);
                
                ballSlow.style.left = `${currentPos}px`;
                
                if (!newProgressTriggered) {
                    startBarAnimation(startTime);
                    newProgressTriggered = true;
                }
                
                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    // Keep the finished element outside even if the viewport grows.
                    ballSlow.style.left = 'calc(100% + 8px)';
                }
            }
            
            animationFrameId = requestAnimationFrame(animate);
        }
        
        function startBarAnimation(startTime) {
            progressNew.style.left = `${geometry.barStart}px`;
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / geometry.barDuration, 1);
                const currentPos = geometry.barStart + (geometry.barDistance * progress);
                
                progressNew.style.left = `${currentPos}px`;
                
                if (progress < 1) {
                    barAnimationFrameId = requestAnimationFrame(animate);
                } else {
                    progressNew.style.left = '100%';
                }
            }
            
            barAnimationFrameId = requestAnimationFrame(animate);
        }
        
        function checkBallPosition() {
            if (progressTriggered) return;
            
            const ball = document.querySelector('.ball');
            const ballLeft = parseFloat(getComputedStyle(ball).left);
            const distanceToEnd = geometry.containerWidth - ballLeft;
            
            if (distanceToEnd < geometry.triggerDistance) {
                progressBar.classList.add('active');
                progressTriggered = true;
                monitorProgressShrink();
            }
            
            if (ballLeft < geometry.containerWidth + 8) {
                requestAnimationFrame(checkBallPosition);
            }
        }
        
        function monitorProgressShrink() {
            if (slowBallTriggered) return;
            
            const barStyle = getComputedStyle(progressBar);
            const barWidth = parseFloat(barStyle.width);
            const containerWidth = parseFloat(getComputedStyle(document.querySelector('.progress-container')).width);
            
            if (barWidth < containerWidth * 0.4) {
                ballSlow.classList.add('active');
                slowBallTriggered = true;
                slowBallStartPos = parseFloat(getComputedStyle(ballSlow).left);
                startBallAnimation();
                return;
            }
            
            requestAnimationFrame(monitorProgressShrink);
        }
        
        checkBallPosition();
        
        window.addEventListener('beforeunload', () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (barAnimationFrameId) cancelAnimationFrame(barAnimationFrameId);
        });
    </script>
</body>
</html>
