<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Button</title>
  <script>
    (() => {
      const themeKey = 'wkjasdka-dark-mode';
      const root = document.documentElement;
      const systemTheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      const savedTheme = () => {
        try {
          const value = localStorage.getItem(themeKey);
          if (value === 'dark' || value === 'true') return 'dark';
          if (value === 'light' || value === 'false') return 'light';
          return 'system';
        } catch (_) {
          return 'system';
        }
      };
      const applyTheme = () => {
        const preference = savedTheme();
        const dark = preference === 'dark' || (preference === 'system' && Boolean(systemTheme && systemTheme.matches));
        root.classList.toggle('dark-mode', dark);
        root.classList.toggle('light-mode', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      applyTheme();
      window.addEventListener('storage', event => {
        if (event.key === themeKey || event.key === null) applyTheme();
      });
      if (systemTheme) {
        const onSystemThemeChange = () => {
          if (savedTheme() === 'system') applyTheme();
        };
        if (systemTheme.addEventListener) systemTheme.addEventListener('change', onSystemThemeChange);
        else if (systemTheme.addListener) systemTheme.addListener(onSystemThemeChange);
      }
    })();
  </script>
  <style>
    .animated-btn {
      width: 380px;
      height: 84px;
      border-radius: 42px;
      border: 2px solid #FFB380;
      font-size: 20px;
      font-weight: 600;
      color: #E67E22;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      background-color: #FFDAB9;
      transition:
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        background-color 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        border-color 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 12px rgba(255, 218, 185, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }

    .animated-btn:hover {
      transform: translateX(-50%) scale(1.12);
      box-shadow: 0 8px 20px rgba(255, 218, 185, 0.8);
      background-color: #FFE4C4;
      border-color: #FF9966;
    }

    .animated-btn:active {
      transform: translateX(-50%) scale(1.08);
      box-shadow: 0 6px 16px rgba(255, 218, 185, 0.6);
      background-color: #FFC38D;
      border-color: #FF9C5A;
    }

    .animated-btn.is-highlighted:active {
      background-color: #FFCF97;
      border-color: #FF8142;
    }

    html.dark-mode .animated-btn {
      color: #ffc08a;
      background-color: #3b3028;
      border-color: #a66a3d;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
    }

    /* 仅在支持鼠标悬停的设备上启用放大动画 */
    @media (hover: hover) and (pointer: fine) {
      .animated-btn:hover {
        transform: translateX(-50%) scale(1.12);
      }

      .animated-btn:active {
        transform: translateX(-50%) scale(1.08);
      }

      html.dark-mode .animated-btn:active {
        background-color: #FFCF97;
        border-color: #FF8142;
        color: #E67E22;
        box-shadow: 0 6px 16px rgba(255, 218, 185, .6);
        transition-duration: .4s, .4s, 0s, 0s;
      }
    }

    /* 触屏设备：按钮适配屏幕宽度 */
    @media (max-width: 768px) {
      .animated-btn {
        width: calc(100vw - 40px);
        max-width: 380px;
        height: 60px;
        border-radius: 30px;
        font-size: 18px;
        border-width: 2px;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
    }

    /* 触屏设备：点击时播放按压动画，松开后保留高亮 */
    @media (hover: none), (pointer: coarse) {
      .animated-btn:hover:not(.is-highlighted) {
        transform: translateX(-50%);
        box-shadow: 0 4px 12px rgba(255, 218, 185, 0.5);
        background-color: #FFDAB9;
        border-color: #FFB380;
      }

      .animated-btn.is-highlighted {
        transform: translateX(-50%);
        box-shadow: 0 8px 20px rgba(255, 218, 185, 0.8);
        background-color: #FFE4C4;
        border-color: #FF9966;
      }

      .animated-btn:active,
      .animated-btn:active:hover,
      .animated-btn.is-touch-pressed,
      .animated-btn.is-touch-pressed:hover {
        transform: translateX(-50%) translateY(2px) scale(.98);
        box-shadow: 0 2px 6px rgba(255, 218, 185, 0.5);
        background-color: #FFC38D;
        border-color: #FF9C5A;
      }

      .animated-btn.is-highlighted:active,
      .animated-btn.is-highlighted:active:hover,
      .animated-btn.is-highlighted.is-touch-pressed,
      .animated-btn.is-highlighted.is-touch-pressed:hover {
        background-color: #FFCF97;
        border-color: #FF8142;
      }

      html.dark-mode .animated-btn:hover:not(.is-highlighted) {
        box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
        background-color: #3b3028;
        border-color: #a66a3d;
      }

      html.dark-mode .animated-btn.is-highlighted {
        box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
        background-color: #4a382b;
        border-color: #d18a58;
      }

      html.dark-mode .animated-btn.is-touch-pressed,
      html.dark-mode .animated-btn:active,
      html.dark-mode .animated-btn:hover.is-touch-pressed,
      html.dark-mode .animated-btn:hover:active,
      html.dark-mode .animated-btn.is-highlighted.is-touch-pressed,
      html.dark-mode .animated-btn.is-highlighted:active,
      html.dark-mode .animated-btn.is-highlighted:hover.is-touch-pressed,
      html.dark-mode .animated-btn.is-highlighted:hover:active {
        background-color: #FFCF97;
        border-color: #FF8142;
        color: #E67E22;
        box-shadow: 0 2px 6px rgba(255, 218, 185, .5);
        transition-duration: .4s, .4s, 0s, 0s;
      }

      html.dark-mode .animated-btn:not(.is-touch-pressed):not(:active) {
        transition-duration: .4s, .4s, 0s, 0s;
      }
    }
  </style>
</head>
<body>
  <button class="animated-btn" type="button">Example</button>

  <script>
    const button = document.querySelector('.animated-btn');
    let pressedPointer = null;

    // 显式跟踪触点，避免部分移动浏览器漏触 :active。
    button.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse') return;
      pressedPointer = event.pointerId;
      button.classList.add('is-touch-pressed');
    }, { capture: true });
    button.addEventListener('touchstart', () => {
      pressedPointer = null;
      button.classList.add('is-touch-pressed');
    }, { capture: true, passive: true });
    ['pointerup', 'pointercancel'].forEach((type) => {
      document.addEventListener(type, (event) => {
        if (event.pointerId !== pressedPointer) return;
        button.classList.remove('is-touch-pressed');
        pressedPointer = null;
      });
    });

    ['touchend', 'touchcancel'].forEach((type) => {
      document.addEventListener(type, () => {
        button.classList.remove('is-touch-pressed');
      }, { capture: true, passive: true });
    });

    // 松开后保留高亮状态。
    button.addEventListener('click', () => {
      button.classList.add('is-highlighted');
    });

    // 触摸或点击按钮以外的任意位置，取消高亮。
    document.addEventListener('pointerdown', (event) => {
      if (!button.contains(event.target)) {
        button.classList.remove('is-highlighted');
      }
    });
  </script>
</body>
</html>
