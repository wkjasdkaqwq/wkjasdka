<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example Button</title>
  <style>
    .animated-btn {
      width: 380px;
      height: 84px;
      border-radius: 42px;
      border: 2px solid #FFB380;
      font-size: 20px;
      font-weight: 600;
      color: #E67E22;
      cursor: pointer;
      background-color: #FFDAB9;
      transition:
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        background-color 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        border-color 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 12px rgba(255, 218, 185, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }

    .animated-btn:hover {
      transform: translateX(-50%) scale(1.12);
      box-shadow: 0 8px 20px rgba(255, 218, 185, 0.8);
      background-color: #FFE4C4;
      border-color: #FF9966;
    }

    .animated-btn:active {
      transform: translateX(-50%) scale(1.08);
      box-shadow: 0 6px 16px rgba(255, 218, 185, 0.6);
      background-color: #FFD2B0;
      border-color: #E67E22;
    }

    /* 仅在支持鼠标悬停的设备上启用放大动画 */
    @media (hover: hover) and (pointer: fine) {
      .animated-btn:hover {
        transform: translateX(-50%) scale(1.12);
      }

      .animated-btn:active {
        transform: translateX(-50%) scale(1.08);
      }
    }

    /* 触屏设备：按钮适配屏幕宽度，点击时不再缩放或跳动 */
    @media (max-width: 768px) {
      .animated-btn {
        width: calc(100vw - 40px);
        max-width: 380px;
        height: 60px;
        border-radius: 30px;
        font-size: 18px;
        border-width: 2px;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
    }

    /* 手机和平板触屏点击时保持位置与尺寸稳定 */
    @media (hover: none), (pointer: coarse) {
      .animated-btn:hover,
      .animated-btn:active {
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <button class="animated-btn" type="button">Example</button>
</body>
</html>
