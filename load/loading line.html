<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Line</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .fade-out {
                animation: fadeOut 0.5s ease-in-out forwards;
            }
            
            @keyframes fadeOut {
                0% { opacity: 1; }
                100% { opacity: 0; visibility: hidden; }
            }
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <!-- 顶部加载条容器 -->
    <div id="progress-container" class="fixed top-0 left-0 w-full h-1 bg-gray-200 z-50">
        <!-- 进度条 -->
        <div id="progress-bar" class="h-full bg-primary transition-all duration-300 w-0"></div>
    </div>

    <!-- 页面主体内容（空白） -->
    <main class="container mx-auto px-4 py-8">
        <!-- 这里可以添加您需要的内容 -->
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const progressBar = document.getElementById('progress-bar');
            const progressContainer = document.getElementById('progress-container');
            
            // 跟踪所有需要加载的资源
            const resources = [
                ...document.getElementsByTagName('img'),
                ...document.getElementsByTagName('link'),
                ...document.getElementsByTagName('script')
            ];
            
            const totalResources = resources.length;
            let loadedResources = 0;
            
            // 更新进度条函数
            function updateProgress() {
                // 计算进度百分比，确保至少显示1%，最多95%（为最后完成留有余地）
                const progress = Math.min(Math.max(Math.round((loadedResources / totalResources) * 100), 1), 95);
                progressBar.style.width = `${progress}%`;
            }
            
            // 为每个资源添加加载完成监听
            resources.forEach(resource => {
                // 如果资源已经加载完成
                if (resource.complete) {
                    loadedResources++;
                    updateProgress();
                    return;
                }
                
                // 监听加载完成事件
                resource.addEventListener('load', () => {
                    loadedResources++;
                    updateProgress();
                });
                
                // 监听加载错误事件（错误的资源也计入已处理）
                resource.addEventListener('error', () => {
                    loadedResources++;
                    updateProgress();
                });
            });
            
            // 监听页面完全加载完成
            window.addEventListener('load', () => {
                // 确保进度条达到100%
                progressBar.style.width = '100%';
                
                // 短暂延迟后隐藏进度条
                setTimeout(() => {
                    progressContainer.classList.add('fade-out');
                }, 300);
            });
            
            // 初始更新一次进度
            updateProgress();
        });
    </script>
    <script src="../scripts/i18n.js"></script>
    <script>
        SiteI18n.init({ defaultLocale: 'en' })
            .catch(error => console.error('[load] Could not initialize language preference.', error));
    </script>
</body>
</html>
